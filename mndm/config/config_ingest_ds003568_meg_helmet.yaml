version: 1.0
modality: meg

# Sensor-topographic MEG pilot for ds003568.  These labels identify fixed CTF
# helmet sectors, not cortical regions.  Membership was frozen from
# sub-24295's CTF coil locations only: left/midline/right split at x=-/+0.03 m,
# anterior/posterior split at y=0.02 m.
imports:
  - "./config_ingest_ds003645.yaml"

datasets: [ds003568]
source:
  dataset_id: "ds003568"
  dataset_name: "MDD MEG sensor-topography pilot"
  url: "https://openneuro.org/datasets/ds003568"

paths:
  received_dir: "K:/ExternalReceivedDatasets/openneuro/received"
  processed_dir: "K:/ExternalReceivedDatasets/openneuro/processed"

preprocess:
  crop: {start_sec: 0, stop_sec: 300}
  meg_bandpass: [1, 45]
  sfreq: 250

mnps_9d:
  datasets:
    ds003568:
      subcoords:
        m_a: {meg_delta: -0.5, meg_theta: -0.5}
        m_e: {meg_alpha: -1.0}
        m_o: {meg_beta_alpha: 1.0}
        d_n: {meg_gamma: 1.0}
        d_l: {meg_hjorth_mobility: 1.0}
        d_s: {meg_alpha_theta: 1.0}
        e_e: {meg_permutation_entropy: 1.0}
        e_s: {meg_hjorth_complexity: 1.0}
        e_m: {meg_sample_entropy: 1.0}

regional_mnps:
  enabled: true
  stratified: {enabled: false}
  block_jacobians: {enabled: false}

