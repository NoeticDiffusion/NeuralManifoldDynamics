version: 2.0
# Choose modality profile for this dataset overlay:
# - eeg
# - nwb
# - nwb_rodent
# - nwb_mouse_eeg
modality: eeg

# Start from one common base and override only what is dataset-specific.
imports:
  - "./config_ingest_common_eeg.yaml"
  # - "./config_ingest_common_nwb.yaml"
  # - "./config_ingest_common_nwb_rodent.yaml"
  # - "./config_ingest_common_nwb_mouse_eeg.yaml"

datasets:
  - example_dataset

source:
  name: "Example Source"
  platform: "OpenNeuro"
  format: "BIDS"
  dataset_id: "example_dataset"
  dataset_name: "Example Dataset Name"
  dataset_version: null
  species: null
  doi: null
  url: null
  acknowledgement: null

paths:
  # You can either set global roots:
  received_dir: "E:/Science_Datasets/openneuro/received"
  processed_dir: "E:/Science_Datasets/openneuro/processed"
  # ...or explicit per-dataset roots:
  dataset_received_dirs:
    example_dataset: "E:/Science_Datasets/openneuro/received/example_dataset"

preprocess:
  # Generic EEG settings (also useful for WFDB EEG overlays).
  sfreq: 250
  sfreq_candidates: [250, 256, 500, 1000]
  notch_hz: 50
  eeg_bandpass: [1, 45]
  reref: "average"
  artifacts:
    method: "none"

  # WFDB-specific toggles (used by PhysioNet I-CARE style .hea/.mat/.dat inputs).
  wfdb:
    scale_to_microvolts: false

  # NWB-specific toggles (used when imports include an NWB common profile).
  nwb:
    enabled: true
    series_path: null
    prefer_series_keywords: ["lfp", "electrical", "ecephys", "eeg"]
    channel_type: "eeg"
    scale_to_microvolts: true
    datasets: {}

  # Optional dataset-specific channel typing policies.
  channel_typing:
    enabled: true
    policy_dir: "mndm/config/channel_typing"
    datasets: {}
      # example_dataset:
      #   rules_file: "example_dataset_channel_typing.yml"
      #   fallback_type: "eeg"

epoching:
  # Global fallback values.
  length_s: 8.0
  step_s: 4.0
  datasets:
    example_dataset:
      # Common defaults for continuous runs:
      length_s: 8.0
      step_s: 4.0
      # Optional profile naming if used by downstream logic:
      # profile: "default_v1"

      # Optional sampling control:
      # sampling:
      #   enabled: false
      #   # Optional: let summarize override stale stage columns in features.csv
      #   # by re-inferring stage from raw BIDS events.
      #   prefer_events_stage_in_summary: false
      #   # Optional generic stage-block inference (off by default).
      #   # Use when event labels are sparse onset markers and you want
      #   # continuous per-window labels across intended stimulation blocks.
      #   #
      #   # Quick recipe:
      #   # 1) stage_columns -> source event label/value column
      #   # 2) stage_map / mnps.stage_codebook -> label->int contract
      #   # 3) stage_blocking.stage_event_regex -> block-start events
      #   # 4) stage_blocking.bridge_marker_labels -> dense in-block markers
      #   stage_blocking:
      #     enabled: false
      #     # Regex for block-start event labels (capture group can hold frequency/intensity).
      #     stage_event_regex: ""
      #     # Optional marker labels that densify the active block until next start event.
      #     bridge_marker_labels: []
      #     use_bridge_markers: true
      #     hv_tail_sec: 0.5
      #     hv_tail_cap_sec: 1.0
      #     min_block_sec: 2.0
      #     max_block_sec: 20.0
      #     preserve_block_assignments: true
      #     # Optional QC expectation list for explicit presence/absence reporting.
      #     expected_stage_frequencies_hz: []
      #
      #   # Backward-compatible aliases still accepted:
      #   # photic_regex -> stage_event_regex
      #   # hv_mark_labels -> bridge_marker_labels
      #   # use_hv_marks -> use_bridge_markers
      #   # preserve_photic_blocks -> preserve_block_assignments
      #   # expected_frequencies_hz -> expected_stage_frequencies_hz

robustness:
  coverage:
    min_seconds: 60
    min_epochs: 20
    datasets:
      example_dataset:
        min_seconds: 60
        min_epochs: 20
  ensembles:
    enabled: false
    min_channels: 3
    groups: {}
    datasets: {}
      # example_dataset:
      #   groups:
      #     frontal: ["Fp1", "Fp2", "F3", "F4", "Fz"]
      #     central: ["C3", "C4", "Cz"]

# Optional EEG-only conventional qEEG comparator layer.
# This writes extra `eeg_conventional_*` feature columns and summarize-time
# rollups beside the canonical MNPS outputs.
conventional_eeg:
  enabled: false
  # Generic EEG comparator packs:
  # - "tier1": relative power, slowing ratios, alpha peak, median frequency, spectral edge
  # - "complexity": spectral entropy, permutation entropy, Hjorth complexity/mobility
  # - "connectivity": summary synchrony features from configured EEG channel pairs
  packs: ["tier1", "complexity", "connectivity"]
  export:
    per_epoch_columns: true
    summaries: true
  tier1:
    relative_bandpower: true
    ratios: ["theta_alpha", "delta_alpha", "alpha_theta", "beta_alpha", "slowing_index"]
    peak_frequency:
      alpha_peak_frequency: true
      median_frequency: true
      spectral_edge_95: true
  complexity:
    spectral_entropy: true
    permutation_entropy: true
    hjorth_complexity: true
    hjorth_mobility: false
  connectivity:
    bands:
      - {name: delta, f_low: 1.0, f_high: 4.0}
      - {name: theta, f_low: 4.0, f_high: 8.0}
      - {name: alpha, f_low: 8.0, f_high: 12.0}
      - {name: beta,  f_low: 13.0, f_high: 30.0}
      - {name: gamma, f_low: 30.0, f_high: 45.0}
    windows: {length_sec: 2.0, step_sec: 0.25}
    roi_pairs:
      - {name: FP, channels: ["F3", "P3"]}
      - {name: FB, channels: ["Fz", "POz"]}
      - {name: LR_occipital, channels: ["O1", "O2"]}
    metrics:
      coherence: true
      plv: true
      pli: true
      wpli: true
      dpli: false
      ppc: false
    outputs:
      summary_stats: ["mean", "std"]
  # Optional per-dataset override surface.
  # datasets:
  #   example_dataset:
  #     enabled: true
  #     packs: ["tier1"]
  datasets: {}

# Optional run-clock enrichment for WFDB-based datasets.
# Keeps /time, /window_start, /window_end unchanged and adds:
# /extensions/time_reference/run/*
# /extensions/time_reference/windows/*
time_reference:
  enabled: false
  schema_version: "time_reference.v1"
  parser: "wfdb_header"
  anchor: "first_recording"
  bins_hours: [0, 24, 48, 72]
  datasets:
    # Enable for WFDB datasets (e.g. PhysioNet I-CARE).
    example_dataset:
      enabled: false
      parser: "wfdb_header"
      anchor: "first_recording"
      bins_hours: [0, 24, 48, 72]

metadata_extraction:
  datasets:
    example_dataset:
      # Optional filename parser for non-BIDS file names.
      # Example for I-CARE: 0332_001_022_EEG.hea
      # filename_parse:
      #   regex: "^(?P<subject>\\d{4})_(?P<run>\\d{3})_(?P<acq>\\d{3})_EEG\\.hea$"
      #   subject_pad: 4

      participants:
        # Optional generic key:value sidecar ingest.
        # Useful for files like "0332.txt" with patient metadata.
        # sidecar_files:
        #   enabled: true
        #   parser: "key_value"
        #   file_globs:
        #     - "*/[0-9][0-9][0-9][0-9].txt"
        #   key_value_separator: ":"
        #   key_normalization: "snake_case"
        #   value_cast: "auto"
        #   subject_id:
        #     from_key: "Patient"
        #     regex: "(?P<subject>\\d{3,8})"
        #     strip_prefixes: ["sub-"]
        #     pad: 4
        #     prefix: "sub-"
        {}

      group:
        default: "UNKNOWN_GROUP"
      condition:
        default: "unknown_condition"
      task:
        # set default task or keep from_filename: true if BIDS naming is informative
        default: "unknown_task"
        # from_filename: true

# v2.2 normalization control block (ComBat-first rollout).
# Start with combat before adding spectral_whitening / riemann.
normalization:
  enabled: false
  method: "combat"
  scope: "post_features"               # pre_features | post_features
  batch_key: "site_or_hospital"
  covariates: ["group", "age", "sex"]
  reference_policy: "within_dataset"   # within_dataset | frozen_external
  combat:
    chunk_size: 24
    min_batch_size: 2
    min_feature_observations: 16
    winsorize_quantiles: [0.005, 0.995]
    family_wise:
      enabled: false
      strategy: "prefix"        # prefix | regex_map
      delimiter: "_"
      min_family_columns: 2
      regex_map: {}
  validation:
    enabled: false
    max_rows: 150000
    max_features: 256
    min_group_size: 20
    max_levels: 24
    batch_key: "auto"
    target_keys: []
    metrics:
      batch_eta2: true
      target_eta2: true
      perturbation: true
  datasets: {}

# Optional event-locked workflow (sleep spindle style overlays).
event_locked:
