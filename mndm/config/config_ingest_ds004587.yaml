version: 2.0
modality: eeg

# ds004587 — Illusion Game EEG + PLUX/BITalino physiology
# 103 healthy adults; BrainVision/actiCHamp EEG at 10 kHz and
# ECG/respiration/PPG physiology at 1 kHz.
#
# The primary task is Illusion Game (IG). Resting-state physiology is
# present in the BIDS beh/ folder, but the released EEG recordings are
# task-IG recordings; task labels are therefore kept filename-derived.
#
# EAP audit:
#   ECG      -> ECG      (cardiac phase / HRV)
#   RESPBIT  -> RESP     (respiration phase / respiratory anchor)
#   OXIBIT   -> PPG      (vascular/PPG signal; retained for downstream use)
#   HR, LUX  -> misc     (not used as primary anchors)
#
# The raw EEG rate is 10,000 Hz. 500 Hz is intentional: it preserves more
# temporal resolution for phase/EAP work than the common 250-Hz output while
# remaining an exact 20:1 downsample.

imports:
  - "./config_ingest_common_eeg.yaml"

datasets:
  - ds004587

source:
  name: "OpenNeuro"
  platform: "OpenNeuro"
  format: "BIDS"
  dataset_id: "ds004587"
  dataset_name: "IllusionGameEEG_data"
  dataset_version: "1.0.0"
  doi: "10.18112/openneuro.ds004587.v1.0.0"
  url: "https://openneuro.org/datasets/ds004587"

paths:
  received_dir: "M:/datasets/received/openneuro"
  processed_dir: "J:/processed/openneuro"
  dataset_received_dirs:
    ds004587: "K:/ExternalReceivedDatasets/openneuro/received/ds004587"

preprocess:
  sfreq: 500
  sfreq_candidates: [500]
  notch_hz: 50
  eeg_bandpass: [1, 45]
  reref: "average"

  datasets:
    ds004587:
      # Companion BIDS physiology is under beh/. The JSON sidecar supplies the
      # 1-kHz rate and exact column names; EEG files are resampled to 500 Hz.
      physio_tsv_inject:
        enabled: true
        path_strategy: "beh_sibling"
        sampling_frequency: 1000.0
        channels:
          - {column: "ECGBIT",  name: "ECG",  type: "ecg", unit: "AU"}
          - {column: "RESPBIT", name: "RESP", type: "resp", unit: "AU"}
          - {column: "OXIBIT",  name: "PPG",  type: "bio", unit: "AU"}
          - {column: "HR",      name: "HR",   type: "misc", unit: "bpm"}
          - {column: "LUX",     name: "LUX",  type: "misc", unit: "AU"}

  # Exact BIDS channel names from the BrainVision sidecars. POz/Oz are
  # positioned as ocular electrodes in the dataset README; type them as EOG
  # when present, while retaining the dedicated HEOG/VEOG channels.
  channel_typing:
    enabled: true
    datasets:
      ds004587:
        rules:
          - {regex: "^(Left HEOG|Right HEOG|Top VEOG|Bottom VEOG)$", type: "eog"}
          - {regex: "^(POz|Oz|Tp9|Tp10)$", type: "eog"}
          - {regex: "^ECG$", type: "ecg"}
          - {regex: "^RESP$", type: "resp"}
          - {regex: "^PPG$", type: "bio"}
          - {regex: "^(HR|LUX|Photosensor)$", type: "misc"}

  # Dedicated HEOG/VEOG channels are used for ICA. ECG is retained as the
  # EAP/HRV signal and may also identify cardiac components.
  artifacts:
    method: "ica"
    ica_n_components: 20
    ica_method: "fastica"
    ica_random_state: 42
    ica_fit_highpass_hz: 1.0
    eog_proxy_channels: []
    ica_eog_threshold: 3.0
    ecg_channel: "ECG"
    ica_ecg_threshold: 3.0
    ica_max_components_to_remove: 5

features:
  eeg:
    spectral:
      bands:
        delta: true
        theta: true
        alpha: true
        beta: true
        gamma: true
        highfreq_power_30_45: true
      ratios:
        alpha_theta: true
        beta_alpha: true
      alpha_peak_frequency: true
      median_frequency: true
      spectral_edge_95: true
    complexity:
      spectral_entropy: true
      permutation_entropy: true
      hjorth_complexity: true
      hjorth_mobility: false

  ecg:
    enabled: true
    hrv:
      enabled: true
      rmssd: true
      sdnn: true
      pnn50: true
      dfa: true
      sample_entropy: true

  resp:
    enabled: true
    rate_bpm: true
    period_s: true
    amplitude: true
    regularity: true
    phase_consistency: true
    pause_fraction: true
    depth_index: true
    slowing_index: true
    anchor_index: true

  eog:
    enabled: true
    blink_rate: true
    blink_amplitude: true
    blink_duration: true
    saccade_rate: true
    saccade_amplitude: true
    eye_stability_index: true

  cardioresp:
    enabled: true
    rsa: true
    coherence: true
    plv: true
    xcorr: true

  # No EDA channel is present in this dataset.
  eda:
    enabled: false

anchor_state:
  # The explicit v0.2 declaration previously had no runtime effect; enable the
  # additive v2 family intentionally for new ds004587 exports.
  version: "v0.2"
  enabled: true
  v2:
    enabled: true

# Phase-resolved EAP outputs. ECG and RESP are injected before feature
# extraction; PPG is retained as a vascular signal but is not substituted for
# ECG in the primary cardiac phase calculation.
phase_anchor:
  enabled: true
  ecg_bipolar: false
  frontal_eeg_channels: ["Fp1", "Fp2", "Fz", "AFz"]
  hep_window_lo_s: 0.200
  hep_window_hi_s: 0.600
  resp_bandpass_lo_hz: 0.10
  resp_bandpass_hi_hz: 0.50
  chunk_minutes: 5
  min_rpeaks_epoch: 5
  min_rpeaks_hep: 3

metadata_extraction:
  datasets:
    ds004587:
      group:
        default: "Healthy"
      task:
        from_filename: true
        normalize:
          IG: "illusion_game"
          ig: "illusion_game"
          rest: "rest"
          Rest: "rest"

indexing:
  multimodal_bundles:
    enabled: false

robustness:
  ensembles:
    enabled: true
    min_channels: 3
    groups:
      frontal: ["Fp1", "Fp2", "F3", "F4", "Fz", "F7", "F8", "AF3", "AF4", "AF7", "AF8"]
      central: ["FC1", "FC2", "C3", "Cz", "C4", "FC3", "FC4", "FCz"]
      parietal_occipital: ["P3", "P4", "Pz", "O1", "O2", "PO3", "PO4", "Oz", "P7", "P8"]
      temporal: ["T7", "T8", "TP7", "TP8"]

conventional_eeg:
  enabled: true
  packs: ["tier1", "complexity"]

summarize:
  allow_group_collisions: false

regional_mnps:
  enabled: true
  stratified:
    enabled: true
  block_jacobians:
    enabled: false

mnps_9d:
  block_jacobians:
    enabled: false
    preset: mde_families_v1
    csv_output: "stratified_block_jacobians_subjects.csv"

# Event-locked Illusion Game trial analysis.
#
# ds004587's raw EEG events.tsv carries only a single "recording start"
# marker (no hardware trial triggers). Per-trial onset_sec is instead
# recovered offline from the injected LUX photosensor channel via
# landmark-consensus clock-offset estimation
# (`project/scripts/28_ds004587_lux_trial_sync.py`,
# `mndm.pipeline.ds004587_lux_sync`) and written as one EventTable CSV per
# run under `event_source.source_path`. Trials whose run failed the sync
# quality gate, or that fall outside the landmark-bracketed interval, carry
# `onset_sec = NaN` and are transparently excluded by the alignment step
# (counted in n_events_excluded_non_finite) rather than being extrapolated.
#
# `stage_filter: []` disables the sleep-stage filter inherited by the default
# profile resolution (this is task data, not sleep; there is no stage axis).
# MNPS windows are 8s/4s-step (config_ingest_common_eeg.yaml); trials occur
# every ~1-3s, so multiple trials commonly share the same MNPS window. The
# single narrow `at_trial` bin (+/-2s) is intentionally used instead of the
# RichSleep pre/post-event bin scheme: with this window cadence there is no
# meaningful "pre/post" structure to resolve at trial time scale, and the
# per-event `event_metadata_json` column (illusion_strength/type/correct/
# rt/block_number/trial_number) plus `rel_time_sec` let the analysis script
# select the single nearest window per trial explicitly.
event_locked:
  datasets:
    ds004587:
      enabled: true
      profile: "ds004587_ig_trial_v1"
      event_source:
        kind: "csv"
      # NOTE: this must be the dataset-level `csv_source_glob`, not
      # `event_source.source_path` -- the latter is read verbatim (without
      # `{events_core}` substitution) by `resolve_event_table_for_event_locked`
      # and takes priority over the per-run resolved path, so setting it here
      # would silently point every run at the same literal, unrendered string.
      csv_source_glob: "J:/processed/openneuro/ds004587_ig_trial_sync/{events_core}_ig_trials_v1.csv"
      event_types: ["ig_trial"]
      stage_filter: []
      reference: "onset"
      bins:
        at_trial: [-2.0, 2.0]
      exclude_stage_transition_margin_sec: 0.0
      min_overlap_fraction: 0.0
      controls:
        n_controls_per_event: 0
        exclusion_margin_sec: 2.0
        time_of_night_quartile_match: false
        seed: 42
      export:
        write_parquet: true
        write_csv: true
        include_coords_9d: true
        provenance_in_every_row: true
        event_condition_label: "ig_trial"
        control_condition_label: "matched_control"
