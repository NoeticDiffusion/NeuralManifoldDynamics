version: 1.2
modality: eeg

# ds003838 dataset overlay config.
# Imports common EEG defaults, then applies only dataset-specific overrides.
imports:
  - "./config_ingest_common_eeg.yaml"

datasets:
  - ds003838

source:
  name: "OpenNeuro"
  platform: "OpenNeuro"
  format: "BIDS"
  dataset_id: "ds003838"
  dataset_name: "EEG, pupillometry, ECG and photoplethysmography, and behavioral data in the digit span task and rest"
  dataset_version: "1.0.6"
  doi: "10.18112/openneuro.ds003838.v1.0.6"
  url: "https://openneuro.org/datasets/ds003838"

paths:
  received_dir: "G:/Science_Datasets_longtime_storage/openneuro/received"
  processed_dir: "G:/Science_Datasets_longtime_storage/processed/openneuro"
  dataset_received_dirs:
    ds003838: "G:/Science_Datasets_longtime_storage/openneuro/received/ds003838"

preprocess:
  eeg_csd:
    enabled: false
    lambda2: 1.0e-5
    stiffness: 4.0
    n_legendre_terms: 50
    min_eeg_channels: 16
    on_error: "warn"

robustness:
  ensembles:
    enabled: true
    min_channels: 3
    groups:
      frontal: ["Fp1", "Fp2", "F3", "F4", "Fz", "F7", "F8"]
      central: ["FC1", "FC2", "C3", "Cz", "C4"]
      parietal_occipital: ["P3", "P4", "Pz", "O1", "O2", "PO3", "PO4", "Oz"]
      temporal: ["T7", "T8", "TP7", "TP8"]

regional_mnps:
  enabled: true
  stratified:
    enabled: true
  block_jacobians:
    enabled: true

mnps_9d:
  block_jacobians:
    enabled: true
    preset: mde_families_v1
    csv_output: "stratified_block_jacobians_subjects.csv"

metadata_extraction:
  datasets:
    ds003838:
      group:
        default: "Healthy"
      # The BIDS task label is `memory`, but the recording contains both passive
      # listening and memorization trials. Normalize it to the paradigm-level name
      # and keep finer task-state separation as a future event-contract step.
      task:
        from_filename: true
        normalize:
          rest: "rest"
          memory: "digit_span"
