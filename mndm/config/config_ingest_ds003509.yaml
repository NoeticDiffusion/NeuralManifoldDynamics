version: 2.0
modality: eeg

# ds003509 overlay for the Parkinson/control Simon conflict cohort.
# Keep medication status session-aware via participants.tsv. A trigger-enriched
# staged root rewrites only the events sidecars with compact derived event
# families while leaving the EEG payload untouched.
imports:
  - "./config_ingest_common_eeg.yaml"

datasets:
  - ds003509

source:
  name: "OpenNeuro"
  platform: "OpenNeuro"
  format: "BIDS (trigger-enriched staging)"
  dataset_id: "ds003509"
  dataset_name: "EEG: Simon Conflict in Parkinson's"
  dataset_version: "1.1.0"
  doi: "10.18112/openneuro.ds003509.v1.1.0"
  url: "https://openneuro.org/datasets/ds003509"
  acknowledgement: "University of New Mexico Cognitive Rhythms and Computation Lab cohort; Parkinson/control repeated-session design with accelerometer X/Y/Z channels."

paths:
  received_dir: "M:/datasets/received/openneuro"
  processed_dir: "M:/datasets/processed/openneuro"
  dataset_received_dirs:
    ds003509: "M:/datasets/received/openneuro/ds003509_trigger_enriched"

preprocess:
  channel_typing:
    datasets:
      ds003509:
        rules:
          - {regex: "^(X|Y|Z)$", type: "misc"}
  artifacts:
    datasets:
      ds003509:
        method: "eog_reg"

epoching:
  datasets:
    ds003509:
      sampling:
        onset_column: "onset"
        duration_column: "duration"
        # Use the staged compact trigger-family surface rather than the raw
        # free-text BIDS trial_type labels. These remain point-like event labels
        # for provenance/event_mapping, not a canonical per-window stage.
        stage_columns: ["event_subtype_role"]
        prefer_events_stage_in_summary: false

event_mapping:
  datasets:
    ds003509:
      enabled: true

mnps:
  # Compact event-family codebook for BIDS event provenance / event-mapping QC.
  # Keep values in signed-int8 range because the stage arrays are serialized as int8.
  stage_codebook:
    training_stimulus_congruent: 10
    training_stimulus_incongruent: 11
    training_response_correct: 12
    training_response_incorrect: 13
    training_no_response: 14
    training_feedback_reward: 15
    training_feedback_punishment: 16
    training_feedback_timeout: 17
    training_feedback_error: 18
    test_stimulus_easy: 20
    test_stimulus_direct_conflict: 21
    test_stimulus_relative_conflict: 22
    test_stimulus_other: 23
    test_response_correct: 24
    test_response_incorrect: 25
    test_no_response: 26

conventional_eeg:
  datasets:
    ds003509:
      enabled: true
      # Parkinson-facing qEEG sidecars: prioritize spectral slowing,
      # alpha peak / edge measures, and common complexity markers.
      packs: ["tier1", "complexity"]
      export:
        per_epoch_columns: true
        summaries: true
      tier1:
        relative_bandpower: true
        ratios: ["theta_alpha", "delta_alpha", "beta_alpha", "slowing_index"]
        peak_frequency:
          alpha_peak_frequency: true
          median_frequency: true
          spectral_edge_95: true
      complexity:
        spectral_entropy: true
        permutation_entropy: true
        hjorth_complexity: true
        hjorth_mobility: true

block_native:
  datasets:
    ds003509:
      enabled: false
      source:
        # Simon conflict task phases: training phase (congruent/incongruent
        # stimuli + feedback) and test phase (easy/conflict stimuli).
        # The trigger-enriched event_subtype_role column carries compact
        # prefix-based family names: training_* and test_*.
        kind: "task_phase"
        label_column: "event_subtype_role"
        onset_column: "onset"
        phase_prefixes:
          training: "training_"
          test: "test_"
        # Tuned from emitted block-duration distribution (2026-06-04):
        # p25~100s, median~210s, p90~281s, max~462s.
        gap_tolerance_sec: 8.0
        min_block_sec: 60.0
        max_block_sec: 360.0
      window_profile:
        profile: "whole_block"
        kind: "sliding"
        window_length_sec: 4.0
        step_sec: 2.0
        emit_relative_position: true
        min_block_sec: 4.0
        min_windows_per_block: 2
      export:
        write_parquet: true
        write_csv: true

mnps_projection:
  export_contracts:
    subject_anchored: true
    cohort_anchored: true
  # Ensure cohort_anchored layers are actually emitted by fitting a frozen
  # anchor from this run's cohort features before summarize starts.
  anchor_auto_fit:
    enabled: true
    anchor_id: "ds003509_cohort_auto_v2_1"
    anchor_source: "ds003509_all_subjects_features_table"
    scale_method: "iqr"
    min_subjects: 3

robustness:
  ensembles:
    enabled: true
    min_channels: 3
    groups:
      frontal: ["Fp1", "Fp2", "F3", "F4", "Fz", "F7", "F8"]
      central: ["FC1", "FC2", "C3", "Cz", "C4"]
      parietal_occipital: ["P3", "P4", "Pz", "O1", "O2", "PO3", "PO4", "Oz"]
      temporal: ["T7", "T8", "TP7", "TP8"]

regional_mnps:
  enabled: true
  stratified:
    enabled: true
  block_jacobians:
    enabled: true

mnps_9d:
  block_jacobians:
    enabled: true
    preset: mde_families_v1
    csv_output: "stratified_block_jacobians_subjects.csv"

metadata_extraction:
  datasets:
    ds003509:
      group:
        candidates: ["Group"]
        normalize:
          pd: "Parkinson"
          ctl: "Control"
      condition:
        default: "not_applicable"
        session_candidates:
          ses-01: ["sess1_Med"]
          ses-02: ["sess2_Med"]
        normalize:
          on: "ON"
          off: "OFF"
          "n/a": "not_applicable"
          "no s2": "not_applicable"
          nan: "not_applicable"
          none: "not_applicable"
          null: "not_applicable"
      task:
        from_filename: true
        default: "simon_conflict"
        normalize:
          simonconflict: "simon_conflict"
