imports:
  - config_ingest_ds004148_v34_baseline_ec_anchor.yml

cohort_selection:
  subject_ids: all_metadata_complete_session1_session2_session3_EC_EO_pairs
  subject_id_range: [sub-01, sub-60]
  sessions: [session2, session3]
