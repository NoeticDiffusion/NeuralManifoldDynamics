# MNPS 3.4 bounded external-anchor pilot on ds004148.
# The frozen ds005385 EyesClosed reference is applied unchanged to every
# selected recording. The 9D coordinates remain experimental and unqualified.
imports:
  - config_ingest_common_eeg_9d.yml

datasets:
  - ds004148

pilot_selection:
  subjects: [sub-04, sub-05, sub-06]
  sessions: [session1]
  tasks: [eyesclosed, eyesopen]
  selection_basis: "The next three BIDS subject IDs after the previous local-anchor 3.4 pilot; fixed before inspecting features or coordinates."
  qc_assessment: "Read-only source QC is stored separately under project/mnps2_audit/outputs/20261113_mnps_v3_4_ds004148_frozen_ec_anchor_pilot. QC metrics do not alter or exclude the feature signal."
  excluded_tasks: [mathematic, memory, music]

exclude-files:
  - "ses-session2_"
  - "ses-session3_"
  - "task-mathematic_"
  - "task-memory_"
  - "task-music_"

paths:
  received_dir: "K:/ExternalReceivedDatasets/openneuro/received"
  processed_dir: "M:/repos/NeuralManifoldDynamics/project/mnps2_audit/outputs/20261113_mnps_v3_4_ds004148_frozen_ec_anchor_pilot/processed"
  dataset_received_dirs: {}

run:
  parallel_backend: threading

preprocess:
  sfreq: 250
  notch_hz: 50
  eeg_bandpass: [1, 45]
  reref: average
  artifacts:
    method: none
  heuristic_bad_channel_exclusion:
    enabled: false

scaling:
  anchor_scope: "Frozen ds005385 session-1 pre-task EyesClosed experimental cohort reference; no target-data refit."
  anchor_id: ds005385_ses1_pretask_EyesClosed_20261111_v1
  anchor_manifest: null
  anchor_manifests_by_condition: {}
  external_anchor:
    preset: null
    path: "M:/repos/NeuralManifoldDynamics/mndm/config/v.3.4/anchors/mnps_v3_4_ds005385_ses1_pretask_EyesClosed_20261111_v1.json"
    compatibility: exploratory_transfer
    transfer_reason: "Bounded external application of the frozen ds005385 EyesClosed scalp-EEG anchor to ds004148. Source and realized sampling rates and native channel count differ; preprocessing, physical amplitude units, average reference, 50 Hz notch, 1-45 Hz bandpass, and 250 Hz realized rate are aligned as far as the data support. Coordinates are reference-relative measurements, not a qualified distance from normal."
    anchor_id: ds005385_ses1_pretask_EyesClosed_20261111_v1
    sha256: 79da8c208a6c9240e84cefee7abc9a26c3121d59c1c86bc3324d33172193d1ab
    reference_feature_units:
      eeg_delta: microvolt^2
      eeg_theta: microvolt^2
      eeg_alpha: microvolt^2
      eeg_beta_alpha: dimensionless_ratio
      eeg_gamma: microvolt^2
      eeg_hjorth_mobility: dimensionless_per_sample
      eeg_alpha_theta: dimensionless_ratio
      eeg_permutation_entropy: dimensionless
      mnps_v3_4_alpha_centroid_hz: Hz
      mnps_v3_4_alpha_envelope_cv: dimensionless
  require_anchor_manifest_for_scaled_output: true
  fit_test_data: false
  fit_separately_per_recording: false
  fit_separately_per_condition: false
  missing_anchor_policy: error_for_scaled_output

summarize:
  qc_policy: keep_all
