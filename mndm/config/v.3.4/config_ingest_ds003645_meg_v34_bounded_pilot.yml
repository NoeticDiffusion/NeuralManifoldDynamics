# Bounded, experimental MEG 3.4 comparison. The inherited feature pipeline and
# legacy MNPS 9D mapping remain enabled; v3.4_MEg measurements are exported to
# their own measurement sidecar and are not used to rewrite the legacy surface.
imports:
  - ../sources/openneuro/config_ingest_ds003645_sensor_topo_pilot.yaml

paths:
  processed_dir: M:/repos/NeuralManifoldDynamics/project/mnps2_audit/outputs/20261117_meg_mnps_v3_4_bounded_pilot/processed

pilot_selection:
  dataset_id: ds003645
  subjects: [sub-002, sub-003, sub-004, sub-005, sub-006]
  task: FacePerception
  runs: [1]
  selection_basis: "Fixed from the existing ds003645 validation-pilot subject list before candidate feature computation; one common run per participant."
  selection_status: frozen_before_candidate_inspection

# Make the legacy feature realization explicit while retaining its existing
# family median-waveform computation. This equals the imported EEG fallback
# settings used by the historical MEG extractor.
features:
  meg_psd:
    method: multitaper
    bandwidth: null
    fmin: 0.0
    fmax: 50.0

mnps_v3_4_meg:
  enabled: true
  definition_version: 3.4-meg-exp.1
  variants:
    - existing_coordinate_set
    - removal_only
    - alpha_replacement
  sensor_family_policy: explicit_mag_grad
  unknown_sensor_type_policy: preserve_unknown_no_coordinate
  scaling:
    mode: raw_only
    anchor_manifest: null
  estimators:
    sample_entropy:
      m: 2
      r_scale: 0.2
      max_n: 300
      invalid_value_policy: missing_with_reason
    alpha_centroid_hz:
      frequency_range_hz: [7.0, 13.0]
      aggregation: median_channel_psd_then_power_weighted_centroid
      psd:
        method: welch
        segment_sec: 4.0
        overlap_fraction: 0.5
        window: hann
        detrend: constant
        scaling: density
    alpha_envelope_cv:
      band_hz: [8.0, 12.0]
      aggregation: median_of_channelwise_cv
      bandpass:
        method: butterworth_sos_zero_phase
        order: 4
      envelope_method: hilbert_magnitude
      edge_support_guard_sec: 10.0
      invalid_value_policy: missing_with_reason
