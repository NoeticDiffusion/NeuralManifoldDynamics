# the first output volume proved too small for temporary feature tables.
imports:
  - "./config_ingest_mnps_bench_001r_ds005385.yaml"

paths:
  processed_dir: "I:/AAA_PYTHON_REPOS_BACKUP/homepages/_mnps_bench_001r_h2r_fast4s_processed"

mnps_9d:
  enabled: false

conventional_eeg:
  enabled: false

mnps_v3_1_measurements:
