# Bounded, prediction-safe EDF measurement pilot for the continuous C1/C3 branch.
# Run only the preregistered sub-100 and sub-105 PSG references first with
# `python -m mndm.cli features --dataset ds005555 --subject 100` / `--subject 105`.
# This is a separate support-only feature branch; it does not replace the
# frozen v5 or ordinary continuous descriptive export and must not summarize.
version: 1.2
modality: eeg

imports:
  - "./config_ingest_ds005555_continuous_c123_cautious_gap_safe_final.yaml"

paths:
  received_dir: "K:/ExternalReceivedDatasets/openneuro/received"
  processed_dir: "K:/processed/ds005555_continuous_c123_prediction_safe_pilot_20260929"
  dataset_received_dirs:
    ds005555: "K:/ExternalReceivedDatasets/openneuro/received/ds005555"

preprocess:
  temporal_support_mode: "causal_finite"
  sfreq: 256
  sfreq_candidates: [256]
  resample:
    method: "identity_sample_grid"
    n_jobs: 1
  notch_hz: null
  eeg_bandpass: [1, 45]
  eeg_bandpass_phase: "minimum"
  meg_bandpass: null
  # Replace inherited crop rules: prediction-safe support is source-grid exact.
  crop:
    __replace: true
  event_crop: {}
  artifacts:
    method: "none"

features:
  ppg:
    estimator: "window_local_present_only_v1"
    refractory_s: 0.35
    prominence_mult: 0.75

robustness:
  bad_channels:
    enabled: false

# Hard gate: only `mndm features` is permitted for this support-only pilot.
# The inherited continuous chart definitions must not produce pilot outputs.
summarize_forbidden: true
mnps_projection:
  __replace: true
mnps_9d:
  __replace: true
  enabled: false
