# ds004100 — OD-EPI-000 transition-eligibility audit overlay.
#
# This overlay inherits the existing ds004100 EEG contract and requests the
# standard orthogonal-dynamics families so their eligibility/refusal states
# are serialized explicitly. It is not an OD-EPI-001 production analysis
# overlay: no translation certificate is enabled here.
#
# Expected policy before OD-EPI-000:
#   diffusion_geometry:
#     not_testable until a non-empty OD-TQ1 certificate is supplied
#   committor:
#     not_testable because no explicit A/B first-hit protocol or reaction
#     coordinate is supplied
#   finite_amplitude_resilience:
#     not_testable / no_perturbation_protocol
#
# In particular, ictal/interictal task labels are not mapped to A/B sets,
# and no reaction coordinate is inferred from MNPS, Jacobians, centroids, or
# spontaneous seizure excursions.

version: 1.2
modality: eeg

imports:
  - "./config_ingest_ds004100.yaml"
  - "../../config_ingest_common_dynamical_families.yaml"

datasets:
  - ds004100

dynamical_families:
  enabled: true
  coordinate_layer: subject_anchored

  diffusion:
    enabled: true
    estimator: local_increment_covariance
    # OD-EPI-000 must not emit computed diffusion before an explicit
    # implementation certificate and dataset eligibility decision are attached.
    translation_qualification:
      qualified: false
      qualification_id: null
      qualification_contract_hash: null
    neighborhood:
      k: 20
    min_samples: 30
    min_neighborhood_samples: 10
    max_gap_sec: null
    max_dt_relative_deviation: 0.05
    psd_floor: 1.0e-8

  destination:
    enabled: true
    # Ictal recordings contain onset/offset markers, but the ingest remains a
    # set of separate ictal/interictal excerpts rather than a qualified
    # continuous first-hit A-to-B trajectory. Do not infer A/B sets or a
    # reaction coordinate in OD-EPI-000; a later gate must qualify that
    # protocol explicitly.
    regime_source: null
    label_key: null
    reaction_coordinate:
      source: explicit_column
      key: null
      name: reaction_coordinate
      boundaries: [-0.8, 0.8]
    estimator: local_law_dense_grid_o2b
    translation_qualification:
      qualified: false
      qualification_id: null
      qualification_contract_hash: null
    grid_resolution: 65
    set_A: []
    set_B: []
    diffusion_coefficient: null
    min_samples: 30
    min_support_per_grid: 30
    min_transition_segments: 5
    max_dt_relative_deviation: 0.05

  resilience:
    enabled: true
    # A spontaneous seizure is not a controlled perturbation protocol.
    protocol_source: null
    estimator: observed_perturbation_outcome_summary
    amplitude_key: null
    returned_key: null
    survived_key: null
    recovery_time_key: null
    protocol: {}
    min_trials_per_amplitude: 20
    translation_qualification:
      qualified: false
      qualification_id: null
      qualification_contract_hash: null
