block_native:
  datasets:
    ds003838:
      enabled: true
      source:
        kind: "duration_events"
        use_derived_task_state_segments: true
        label_column: "trial_type"
        onset_column: "onset"
        duration_column: "duration"
        block_event_labels: ["rest", "listen", "mem5", "mem9", "mem13"]
        block_event_stage_codes:
          "rest": 0
          "listen": 1
          "mem5": 5
          "mem9": 9
          "mem13": 13
        min_block_sec: 8.0
        max_block_sec: 600.0
      window_profile:
        profile: "whole_block"
        kind: "sliding"
        window_length_sec: 8.0
        step_sec: 4.0
        emit_relative_position: true
        min_block_sec: 8.0
        min_windows_per_block: 1
      export:
        write_parquet: true
        write_csv: true

mnps:
  embodied:
    enabled: true
    channels:
      - ecg_hr_bpm
      - ecg_rmssd
      - ppg_rate_bpm
      - ppg_amplitude_mean
      - pupil_diameter_mean
      - pupil_dilation_velocity

regional_mnps:
  enabled: true
  stratified:
    enabled: true
  block_jacobians:
    enabled: false

mnps_9d:
  block_jacobians:
    enabled: false
    preset: mde_families_v1
    csv_output: "stratified_block_jacobians_subjects.csv"

metadata_extraction:
  datasets:
    ds003838:
      group:
        default: "Healthy"
      # The BIDS task label is `memory`, but the recording contains both passive
      # listening and memorization trials. Normalize it to the paradigm-level name
      # and keep finer task-state separation as a future event-contract step.
      task:
        from_filename: true
        normalize:
          rest: "rest"
          memory: "digit_span"
