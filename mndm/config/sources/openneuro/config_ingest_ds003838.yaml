version: 1.2
modality: eeg

# ds003838 dataset overlay config.
# Imports common EEG defaults, then applies only dataset-specific overrides.
imports:
  - "../../config_ingest_common_eeg.yaml"

datasets:
  - ds003838

source:
  name: "OpenNeuro"
  platform: "OpenNeuro"
  format: "BIDS"
  dataset_id: "ds003838"
  dataset_name: "EEG, pupillometry, ECG and photoplethysmography, and behavioral data in the digit span task and rest"
  dataset_version: "1.0.6"
  doi: "10.18112/openneuro.ds003838.v1.0.6"
  url: "https://openneuro.org/datasets/ds003838"

paths:
  received_dir: "G:/Science_Datasets_longtime_storage/openneuro/received"
  processed_dir: "J:/processed/openneuro"
  dataset_received_dirs:
    ds003838: "G:/Science_Datasets_longtime_storage/openneuro/received/ds003838"

indexing:
  multimodal_bundles:
    enabled: true
    group_by: ["subject", "session", "task", "run", "acq"]
    primary_modality: "eeg"
    include_modalities: ["eeg", "ecg", "pupil", "beh"]

preprocess:
  eeg_csd:
    enabled: false
    lambda2: 1.0e-5
    stiffness: 4.0
    n_legendre_terms: 50
    min_eeg_channels: 16
    on_error: "warn"

robustness:
  ensembles:
    enabled: true
    min_channels: 3
    groups:
      frontal: ["Fp1", "Fp2", "F3", "F4", "Fz", "F7", "F8"]
      central: ["FC1", "FC2", "C3", "Cz", "C4"]
      parietal_occipital: ["P3", "P4", "Pz", "O1", "O2", "PO3", "PO4", "Oz"]
      temporal: ["T7", "T8", "TP7", "TP8"]

features:
  ecg:
    peak_detector: "neurokit2"   # Pan-Tompkins via NeuroKit2; avoids T-wave double-detection
    hrv:
      enabled: true
      superwindow_s: 60.0
      window_mode: centered
      min_nn_intervals: 20
      min_coverage_fraction: 0.5
      max_artifact_fraction: 0.25
      pnn50_threshold_ms: 50.0
      complexity:
        enabled: true
        sampen_order: 2
        sampen_tolerance_mult: 0.2
        min_nn_for_sampen: 50
        dfa_short_nvals_lo: 4
        dfa_short_nvals_hi: 12
        min_nn_for_dfa: 16

anchor_state:
  enabled: true

anchor_coupling:
  enabled: true
  super_window: 3
  ridge_alpha: 1.0
  distance_weighted: false
  min_windows: 3
  condition_number_max: 1000000.0

within_run_labels:
  datasets:
    ds003838:
      enabled: true
      output_name: task_state_label
      write_to_stage: false
      write_to_labels: true
      codebook_name: ds003838_task_state
      codebook:
        rest: 0
        listen: 1
        mem5: 5
        mem9: 9
        mem13: 13
        memory: 2
      rules:
        - id: ds003838_task_state_from_features
          source:
            type: column_from_features
            column: task_state_label

event_locked:
  datasets:
    ds003838:
      enabled: true
      event_source:
        kind: csv
        event_type: task_state
        source_label: derived:task_state_label
      event_types: ["rest", "listen", "mem5", "mem9", "mem13"]
      reference: onset
      stage_filter: []
      bins:
        pre_8s: [-8.0, 0.0]
        post_early_8s: [0.0, 8.0]
        post_late_8s: [8.0, 16.0]
      controls:
        n_controls_per_event: 2
        exclusion_margin_sec: 8.0
        seed: 7
      export:
        write_parquet: true
        write_csv: true

# ---------------------------------------------------------------------------
