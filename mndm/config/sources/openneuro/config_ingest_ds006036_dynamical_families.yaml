# ds006036 — v3 dynamical-families overlay.
#
# Continuous MNPS grid (common EEG window_sec 8.0 / overlap 0.5 → dt 4 s). Photic
# stage-blocking / event-locked / block-native stay on the base yaml;
# they are off here so increment families and one-step see regular dt.
# Global MNPS 3D/9D only: no regional MNPS, no regional Jacobian metrics,
# no block Jacobians. Family adapters plus Jacobian-derived local dynamics.
# Eligibility / refusal test, not a translation-qualified production analysis.
#
# Expected write states:
#   diffusion:   computed when estimator support holds
#                (measurement_validity=not_assessed; no OD-TQ1 copy)
#   drift:       computed 003 identities when support holds. Not Itô b,
#                not /mnps_3d_dot, not A_bD.
#   one_step:    computed recording-level affine map when blocked holdout
#                beats the generic 0.9 mean-next-state gate; level-3
#                generator proxies only if identified. declared_lags:
#                [1, 2] writes direct lag-2 identities under declared_lag_2/.
#                iterated_one_step_horizon_map_level4 writes when lag-1
#                Phi is identified. Not ito_drift_level3. Common overlay
#                default is [1]. Threshold stays 0.9.
#   amplification / history / turning: computed when support holds.
#   destination: not_testable (no explicit first-hit A/B or reaction coordinate)
#   resilience:  not_testable / no_perturbation_protocol
#   jacobian metrics: computed when J_hat exists (measurement_validity=not_assessed)
#   FTR: computed when Jacobian support allows (validation_level=model_derived)
#   Gate E residuals + Q proxy: computed when J_hat and regular dt allow
#   Gate F W_Q: computed only when Gate E Q is admissible
#                (discrete chart-space spread; not process noise)
#   grain + certificate + /support_signature/v1: written on new files
#
# Nested C1 diffusion.drift.enabled stays false. Do not copy OD-TQ1 hashes
# or the I-CARE jacobian_metrics.fit_fidelity_gate here.
version: 1.2
modality: eeg

imports:
  - "./config_ingest_ds006036.yaml"
  - "../../config_ingest_common_dynamical_families.yaml"

datasets:
  - ds006036

paths:
  received_dir: "K:/ExternalReceivedDatasets/openneuro"
  processed_dir: "K:/processed/ds006036_dynamical_families"
  dataset_received_dirs:
    ds006036: "K:/ExternalReceivedDatasets/openneuro/ds006036"

robustness:
  ensembles:
    enabled: false

regional_mnps:
  enabled: false
  stratified:
    enabled: false
  block_jacobians:
    enabled: false

mnps_9d:
  enabled: true
  block_jacobians:
    enabled: false

# DF coordinate_layer is subject_anchored. Base yaml auto-fits a
# cohort IQR anchor with min_subjects: 3, which fail-closes a
# one-subject smoke and is unused by this overlay.
mnps_projection:
  export_contracts:
    subject_anchored: true
    cohort_anchored: false
  anchor_auto_fit:
    enabled: false

epoching:
  datasets:
    ds006036:
      sampling:
        stage_blocking:
          enabled: false

event_locked:
  datasets:
    ds006036:
      enabled: false

block_native:
  datasets:
    ds006036:
      enabled: false

dynamical_families:
  enabled: true
  coordinate_layer: subject_anchored

  diffusion:
    enabled: true
    estimator: local_increment_covariance
    translation_qualification:
      qualified: false
      qualification_id: null
      qualification_contract_hash: null
    neighborhood: {k: 20}
    min_samples: 30
    min_neighborhood_samples: 10
    max_gap_sec: null
    max_dt_relative_deviation: 0.05
    psd_floor: 1.0e-8

  drift:
    enabled: true

  # Coverage opt-in: declared_lags [1, 2] writes direct lag-2 identities.
  # Common overlay default is [1]. Threshold stays generic 0.9.
  # Not ito_drift_level3.
  one_step:
    enabled: true
    declared_lags: [1, 2]

  amplification:
    enabled: true

  history:
    enabled: true

  turning:
    enabled: true

  destination:
    enabled: true
    regime_source: null
    label_key: null
    reaction_coordinate:
      source: explicit_column
      key: null
      name: reaction_coordinate
      boundaries: [-0.8, 0.8]
    estimator: local_law_dense_grid_o2b
    translation_qualification:
      qualified: false
      qualification_id: null
      qualification_contract_hash: null
    grid_resolution: 65
    set_A: []
    set_B: []
    diffusion_coefficient: null
    min_samples: 30
    min_support_per_grid: 30
    min_transition_segments: 5
    max_dt_relative_deviation: 0.05

  resilience:
    enabled: true
    protocol_source: null
    estimator: observed_perturbation_outcome_summary
    amplitude_key: null
    returned_key: null
    survived_key: null
    recovery_time_key: null
    protocol: {}
    min_trials_per_amplitude: 20
    translation_qualification:
      qualified: false
      qualification_id: null
      qualification_contract_hash: null

local_dynamics:
  jacobian_metrics:
    stability_zero_tolerance: 1.0e-8
    reactivity_zero_tolerance: 1.0e-8
  finite_time_response:
    enabled: true
    propagator_mode: time_ordered_expm
    horizon_steps: [1, 2, 4]
    max_gap_sec: null
    validation_level: model_derived
  transition_residuals:
    enabled: true
    crossfit_embargo_steps: 4
    max_dt_deviation_sec: 1.0e-6
    min_eigenvalue: 1.0e-8
  stochastic_reachability:
    enabled: true
