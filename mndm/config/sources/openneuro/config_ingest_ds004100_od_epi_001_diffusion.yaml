# ds004100 — OD-EPI-001 qualified diffusion translation overlay.
#
# This is a separate empirical diffusion/QC overlay. It activates only the
# OD-TQ1-qualified diffusion adapter; it does not authorize committor or
# finite-amplitude resilience computation.
#
# The certificate licenses adapter translation, not biological interpretation:
# qualification and dataset-specific support/validity remain separate gates.

version: 1.2
modality: eeg

imports:
  - "./config_ingest_ds004100.yaml"
  - "../../config_ingest_common_dynamical_families.yaml"

datasets:
  - ds004100

dynamical_families:
  enabled: true
  coordinate_layer: subject_anchored

  diffusion:
    enabled: true
    estimator: local_increment_covariance
    translation_qualification:
      qualified: true
      qualification_id: "OD-TQ1-MNDM-DIFFUSION-V1"
      qualification_contract_hash: "d80dffd7b94e7f5260fae66b3fdd2dd505bca3ad29e3c074a6b3d7cbaffe1722"
    neighborhood:
      k: 20
    min_samples: 30
    min_neighborhood_samples: 10
    max_gap_sec: null
    max_dt_relative_deviation: 0.05
    min_valid_fraction: 0.1
    psd_floor: 1.0e-8

  destination:
    enabled: true
    # The dataset contains separate ictal/interictal excerpts. Do not map task
    # labels to A/B or infer a reaction coordinate for this diffusion gate.
    regime_source: null
    label_key: null
    reaction_coordinate:
      source: explicit_column
      key: null
      name: reaction_coordinate
      boundaries: [-0.8, 0.8]
    estimator: local_law_dense_grid_o2b
    translation_qualification:
      qualified: false
      qualification_id: null
      qualification_contract_hash: null
    grid_resolution: 65
    set_A: []
    set_B: []
    diffusion_coefficient: null
    min_samples: 30
    min_support_per_grid: 30
    min_transition_segments: 5
    max_dt_relative_deviation: 0.05

  resilience:
    enabled: true
    # Observational seizure recordings are not controlled perturbation trials.
    protocol_source: null
    estimator: observed_perturbation_outcome_summary
    amplitude_key: null
    returned_key: null
    survived_key: null
    recovery_time_key: null
    protocol: {}
    min_trials_per_amplitude: 20
    translation_qualification:
      qualified: false
      qualification_id: null
      qualification_contract_hash: null

# Re-assert local_dynamics explicitly. `imports` are deep-merged in listed
# order and this overlay's own top-level keys win last, but the merge order
# above is [ds004100.yaml, config_ingest_common_dynamical_families.yaml]:
# without this block, the common file's local_dynamics (enabled: false)
# would silently override ds004100.yaml's finite_time_response.enabled:
# true / transition_residuals.enabled: true after it, defeating the intent
# of the base dataset config. Values below match ds004100.yaml exactly.
local_dynamics:
  jacobian_metrics:
    stability_zero_tolerance: 1.0e-8
    reactivity_zero_tolerance: 1.0e-8
  finite_time_response:
    enabled: true
    propagator_mode: time_ordered_expm
    horizon_steps: [1, 2, 4]
    max_gap_sec: null
    validation_level: model_derived
  transition_residuals:
    enabled: true
    crossfit_embargo_steps: 4
    max_dt_deviation_sec: 1.0e-6
    min_eigenvalue: 1.0e-8
