version: 2.0
modality: eeg

# ds003474 — Probabilistic Selection Task EEG, Allen Lab, U Arizona.
# Companion to ds003478 (resting EEG, same lab, overlapping BDI-stratified cohort).
# ~122 college-age participants; subjects scored reliably high or low on BDI.
# Some subjects clinically interviewed; sub-544 excluded (unstable BDI pre→test).
# Data recorded 2008-2010, Neuroscan Synamps2, 500 Hz, 60 Hz line noise.
# Known caveats:
#   - HEOG/VEOG typed as n/a in channels.tsv; EOGChannelCount=0 in sidecar.
#   - Some subjects have pre-interpolated channels; no raw data available.
# Paper: doi:10.1162/cpsy_a_00024   PMID: 31149639   (Cavanagh 2019)
# Dataset DOI: 10.18112/openneuro.ds003474.v1.1.0
imports:
  - "../../config_ingest_common_eeg.yaml"

datasets:
  - ds003474

source:
  name: "OpenNeuro"
  platform: "OpenNeuro"
  format: "BIDS"
  dataset_id: "ds003474"
  dataset_name: "EEG: Probabilistic Selection and Depression"
  dataset_version: "1.1.0"
  doi: "10.18112/openneuro.ds003474.v1.1.0"
  url: "https://openneuro.org/datasets/ds003474"
  acknowledgement: >-
    James F Cavanagh, Allen Lab, University of Arizona. Data 2008-2010.
    HowToAcknowledge: PMID 31149639 / doi:10.1162/cpsy_a_00024

paths:
  received_dir: "N:/received"
  processed_dir: "N:/processed"
  dataset_received_dirs:
    ds003474: "N:/received/ds003474"

preprocess:
  channel_typing:
    datasets:
      ds003474:
        # channels.tsv types all channels as n/a (EOGChannelCount=0 in sidecar).
        # HEOG and VEOG are last two channels; type them explicitly so eog_reg works.
        rules:
          - {name: "HEOG", type: "eog"}
          - {name: "VEOG", type: "eog"}
          # CB1/CB2 are cerebellar/reference sites — treat as misc to avoid contaminating EEG.
          - {regex: "^CB[12]$", type: "misc"}
          # M2 is a mastoid reference channel.
          - {name: "M2", type: "misc"}
  artifacts:
    datasets:
      ds003474:
        method: "eog_reg"   # regress HEOG/VEOG after explicit re-typing above

epoching:
  datasets:
    ds003474:
      sampling:
        onset_column: "onset"
        duration_column: "duration"
        stage_columns: ["trial_type"]
        # Task events are point-like; do not promote to canonical resting stage.
        prefer_events_stage_in_summary: false

event_mapping:
  datasets:
    ds003474:
      enabled: true

mnps:
  # Compact event codebook for probabilistic selection task.
  # Keep values in signed-int8 range (-128..127).
  stage_codebook:
    STATUS:              0
    "Train Stim: A B":  10
    "Train Stim: B A":  11
    "Train Stim: C D":  12
    "Train Stim: D C":  13
    "Train Stim: E F":  14
    "Train Stim: F E":  15
    "Feedback: Correct":   16
    "Feedback: Incorrect": 17
    "Left response":    20
    "Right response":   21
    "Test Stim: A B":   30
    "Test Stim: A C":   31
    "Test Stim: A D":   32
    "Test Stim: A E":   33
    "Test Stim: A F":   34
    "Test Stim: B A":   35
    "Test Stim: B C":   36
    "Test Stim: B D":   37
    "Test Stim: B E":   38
    "Test Stim: B F":   39
    "Test Stim: C A":   40
    "Test Stim: C B":   41
    "Test Stim: C D":   42
    "Test Stim: C E":   43
    "Test Stim: C F":   44
    "Test Stim: D A":   45
    "Test Stim: D B":   46
    "Test Stim: D C":   47
    "Test Stim: D E":   48
    "Test Stim: D F":   49
    "Test Stim: E A":   50
    "Test Stim: E B":   51
    "Test Stim: E C":   52
    "Test Stim: E D":   53
    "Test Stim: E F":   54
    "Test Stim: F A":   55
    "Test Stim: F B":   56
    "Test Stim: F C":   57
    "Test Stim: F D":   58
    "Test Stim: F E":   59

block_native:
  datasets:
    ds003474:
      # Training and test phases inferred from event family prefix.
      # Training phase: ~first half of recording (Train Stim + Feedback events).
      # Test phase: ~second half (Test Stim events only, no feedback).
      enabled: false
      source:
        kind: "task_phase"
        label_column: "trial_type"
        onset_column: "onset"
        phase_prefixes:
          training: "Train Stim:"
          test:     "Test Stim:"
        gap_tolerance_sec: 30.0
        min_block_sec: 60.0
        max_block_sec: 600.0
      window_profile:
        profile: "whole_block"
        kind: "sliding"
        window_length_sec: 4.0
        step_sec: 2.0
        emit_relative_position: true
        min_block_sec: 4.0
        min_windows_per_block: 2
      export:
        write_parquet: true
        write_csv: true

conventional_eeg:
  datasets:
    ds003474:
      enabled: true
      # Depression/BDI-facing qEEG: spectral slowing, alpha peak, complexity.
      packs: ["tier1", "complexity"]
      export:
        per_epoch_columns: true
        summaries: true
      tier1:
        relative_bandpower: true
        ratios: ["theta_alpha", "delta_alpha", "beta_alpha", "slowing_index"]
        peak_frequency:
          alpha_peak_frequency: true
          median_frequency: true
          spectral_edge_95: true
      complexity:
        spectral_entropy: true
        permutation_entropy: true
        hjorth_complexity: true
        hjorth_mobility: true

mnps_projection:
  export_contracts:
    subject_anchored: true
    cohort_anchored: true
  anchor_auto_fit:
    enabled: true
    anchor_id: "ds003474_cohort_auto_v2_1"
    anchor_source: "ds003474_all_subjects_features_table"
    scale_method: "iqr"
    min_subjects: 3

robustness:
  ensembles:
    enabled: true
    min_channels: 3
    groups:
      frontal:            ["FP1", "FPZ", "FP2", "AF3", "AF4", "F7", "F5", "F3", "F1", "FZ", "F2", "F4", "F6", "F8"]
      central:            ["FC3", "FC1", "FCZ", "FC2", "FC4", "C5", "C3", "C1", "CZ", "C2", "C4", "C6"]
      parietal_occipital: ["P7", "P5", "P3", "P1", "PZ", "P2", "P4", "P6", "P8",
                           "PO7", "PO5", "PO3", "POZ", "PO4", "PO6", "PO8", "O1", "OZ", "O2"]
      temporal:           ["T7", "T8", "TP7", "TP8", "CP5", "CP3", "CP1", "CPZ", "CP2", "CP4", "CP6"]

regional_mnps:
  enabled: true
  stratified:
    enabled: true
  block_jacobians:
    enabled: true

mnps_9d:
  block_jacobians:
    enabled: true
    preset: mde_families_v1
    csv_output: "stratified_block_jacobians_subjects.csv"

metadata_extraction:
  datasets:
    ds003474:
      group:
        # participants.tsv has continuous BDI (0–63) and STAI — no binary Group column.
        # BDI_group / Group are kept as fallback candidates in case a phenotype sheet
        # is added later. The primary use is BDI as a continuous covariate.
        candidates: ["Group", "BDI_group", "bdi_group", "Diagnosis", "diagnosis"]
        normalize:
          high:    "HighBDI"
          highbdi: "HighBDI"
          hbdi:    "HighBDI"
          low:     "LowBDI"
          lowbdi:  "LowBDI"
          lbdi:    "LowBDI"
      condition:
        default: "task"
      task:
        from_filename: true
        default: "probabilistic_selection"
        normalize:
          probabilisticselection: "probabilistic_selection"
