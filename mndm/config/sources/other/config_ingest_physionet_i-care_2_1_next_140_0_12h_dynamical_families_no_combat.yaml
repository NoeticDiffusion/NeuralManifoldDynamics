version: 2.0
modality: eeg

# I-CARE next_140 (0-12h) dynamical-families overlay, unharmonized
# (no-ComBat) twin.
#
# Same contract as
# config_ingest_physionet_i-care_2_1_next_140_0_12h_dynamical_families.yaml
# (which inherits ComBat=on from ..._no_regional.yaml) with ComBat
# harmonization turned back off, for a side-by-side unharmonized export.
# See the parent file's 2026-09-11 header note
# (ingest_jacobian_fidelity_handover_2.md item 10).
imports:
  - "./config_ingest_physionet_i-care_2_1_next_140_0_12h_dynamical_families.yaml"

paths:
  processed_dir: "K:/processed/physionet_icare_2_1_next140_0_12h_dynamical_families_no_combat"

normalization:
  enabled: false
  validation:
    enabled: false
  datasets:
    physionet_icare_2_1:
      enabled: false
      batch_key: "hospital"
      covariates: ["group", "age", "sex"]
