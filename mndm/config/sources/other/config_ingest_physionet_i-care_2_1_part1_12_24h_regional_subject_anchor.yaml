version: 2.0
modality: eeg

# I-CARE part1 CPC1/5 12-24h export with regional MNPS enabled.
# Keep this first pass free of block Jacobian outputs.
imports:
  - "./config_ingest_physionet_i-care_2_1_12_24.yaml"

paths:
  # Keep standard PhysioNet processed root; pass --out-dir to isolate reruns.
  processed_dir: "E:/Science_Datasets/physionet/processed"
  dataset_received_dirs:
    physionet_icare_2_1: "E:/Science_Datasets/physionet/received/i-care_2_1_part1_cpc15_longitudinal_12_24h/training"

regional_mnps:
  enabled: true
  stratified:
    enabled: true
  block_jacobians:
    enabled: false

mnps_9d:
  enabled: true
  block_jacobians:
    enabled: false

conventional_eeg:
  enabled: true
  packs: ["tier1", "complexity"]
  export:
    per_epoch_columns: true
    summaries: true

normalization:
  enabled: false
  method: "combat"
  scope: "post_features"
  batch_key: "hospital"
  covariates: ["group", "age", "sex"]
  reference_policy: "within_dataset"
  combat:
    chunk_size: 24
    min_batch_size: 2
    min_feature_observations: 16
    winsorize_quantiles: [0.005, 0.995]
    family_wise:
      enabled: false
      strategy: "prefix"
      delimiter: "_"
      min_family_columns: 2
      regex_map: {}
  validation:
    enabled: false
    max_rows: 150000
    max_features: 256
    min_group_size: 20
    max_levels: 24
    batch_key: "auto"
    target_keys: ["group", "cpc"]
    metrics:
      batch_eta2: true
      target_eta2: true
      perturbation: true
  datasets:
    physionet_icare_2_1:
      enabled: false
      batch_key: "hospital"
      covariates: ["group", "age", "sex"]

mnps_projection:
  anchor:
    enabled: false
