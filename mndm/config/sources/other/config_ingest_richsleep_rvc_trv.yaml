# ── Known data notes ─────────────────────────────────────────────────
# [1] Airflow channel (xn001): very low amplitude (std ~0.021 mV vs Chest ~0.36 mV).
#     Chest and Abdomen are the primary resp channels.
#     resp_regular_index is derived from Chest (primary_channel: "Chest").
# [2] EtCO2 channel: constant 0.183 in xn001 → likely dead.  Typed as misc.
# [3] R-R channel: physical encoding unclear (stored in volts, range ±3.2 mV,
#     which does not map directly to RR intervals in seconds).
#     Typed as misc; raw ECG channel is used for HRV extraction.
# [4] xn001 annotation: 37% N1 (vs typical <20%) → staging idiosyncrasy.
#     Subject retained for analysis; N1 epochs excluded from spindle analysis.
# [5] xn017: 2 REM epochs only.  Subject excluded from REM stage analysis
#     by min_block_sec cutoff; included in all other analyses.
# [6] Linked mastoid reference (e.g. F3-A2): average re-referencing disabled
#     (preprocess.reref: null) to preserve the original linked mastoid montage.
