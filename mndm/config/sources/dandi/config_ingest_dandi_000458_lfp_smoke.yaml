version: 2.0
modality: nwb_rodent_lfp

imports:
  - "../../config_ingest_common_nwb_rodent.yaml"

datasets: ["dandi_000458"]

source:
  name: "DANDI 000458 LFP smoke"
  platform: "DANDI"
  format: "NWB"
  dataset_id: "000458"
  dataset_name: "Mouse ecephys LFP smoke"
  species: "Mus musculus"

paths:
  received_dir: "data/dandi/raw/000458"
  processed_dir: "data/dandi/processed_lfp/000458_smoke"
  dataset_received_dirs:
    dandi_000458: "data/dandi/raw/000458"

preprocess:
  sfreq: 1000
  sfreq_candidates: [500, 1000, 1250, 2500]
  notch_hz: 60
  eeg_bandpass: [0.5, 250]
  reref: null
  # Bound the initial LFP validation to avoid materialising the complete
  # 384-channel, 114-minute recording before resampling.
  crop: {start_sec: 0, stop_sec: 59}
  nwb:
    datasets:
      dandi_000458:
        units: {enabled: false}
        # Confirmed by dandi_000458_lfp_smoke_probe.json; choose one probe
        # explicitly so surface EEG cannot win a keyword match.
        series_path: "acquisition/LFPprobeB/ElectricalSeriesprobeB"
        prefer_series_keywords: ["lfp"]
        channel_type: "seeg"
        scale_to_microvolts: true
        max_channels: 32

epoching:
  length_s: 4.0
  step_s: 2.0

features:
  eeg_psd:
    method: "multitaper"
    fmin: 0.5
    fmax: 250.0
  eeg_bands:
    delta: [0.5, 4]
    theta: [4, 8]
    alpha: [8, 13]
    beta: [13, 30]
    gamma: [30, 100]
    high_gamma: [100, 200]
