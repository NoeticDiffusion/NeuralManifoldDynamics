version: 2.0
modality: nwb_rodent_lfp

imports:
  - "../../config_ingest_common_nwb_rodent.yaml"

datasets: ["dandi_000458"]

source:
  name: "DANDI 000458 full-session probe B LFP"
  platform: "DANDI"
  format: "NWB"
  dataset_id: "000458"
  dataset_name: "Mouse ecephys LFP"
  species: "Mus musculus"

paths:
  received_dir: "data/dandi/raw/000458"
  processed_dir: "data/dandi/processed_lfp/000458_probeB_full"
  dataset_received_dirs:
    dandi_000458: "data/dandi/raw/000458"

preprocess:
  sfreq: 500
  notch_hz: 60
  eeg_bandpass: [1, 150]
  reref: null
  nwb:
    units: {enabled: false}
    series_path: "acquisition/LFPprobeB/ElectricalSeriesprobeB"
    channel_type: "seeg"
    scale_to_microvolts: true
    streaming_sfreq: 500
    chunk_sec: 60
    channel_selection:
      artifact_path: "data/dandi/processed_lfp/000458_full/qc_artifacts/sub-551399_ses-20210128_behavior+ecephys_probeB_lfp_channel_selection.json"

epoching:
  length_s: 4.0
  step_s: 2.0
