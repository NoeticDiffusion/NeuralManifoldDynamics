version: 2.0
modality: eeg

# PhysioNet I-CARE (WFDB) overlay for MNDM smoke and longitudinal analysis.
# Usage:
#   python -m mndm.cli features --dataset physionet_icare_2_1 --config mndm/config/config_ingest_physionet_i-care_2_1.yaml --n-jobs 1
#   python -m mndm.cli summarize --dataset physionet_icare_2_1 --config mndm/config/config_ingest_physionet_i-care_2_1.yaml --n-jobs 1
imports:
  - "./config_ingest_common_eeg.yaml"

datasets:
  - physionet_icare_2_1

source:
  name: "PhysioNet"
  platform: "PhysioNet"
  format: "WFDB"
  dataset_id: "i-care"
  dataset_name: "I-CARE: International Cardiac Arrest REsearch consortium Database"
  dataset_version: "2.1"
  doi: "10.13026/m33r-bj81"
  url: "https://physionet.org/content/i-care/2.1/"

paths:
  processed_dir: "E:/Science_Datasets/physionet/processed"
  dataset_received_dirs:
    physionet_icare_2_1: "E:/Science_Datasets/physionet/received/i-care_2_1_random100_longitudinal/training"

preprocess:
  # Keep native cadence (avoid unnecessary upsampling from WFDB records).
  sfreq: 100
  sfreq_candidates: [100, 128, 200, 250]
  notch_hz: null
  eeg_bandpass: [0.5, 40]
  reref: "average"
  wfdb:
    scale_to_microvolts: false
  artifacts:
    method: "none"

robustness:
  ensembles:
    enabled: true
    min_channels: 3
    groups:
      # Confirmed in current I-CARE headers:
      # C3, C4, O1, O2, Cz, F3, F4, F7, F8, Fz, Fp1, Fp2, Fpz, P3, P4, Pz, T3, T4, T5, T6
      frontal: ["Fp1", "Fp2", "Fpz", "F3", "F4", "F7", "F8", "Fz"]
      central: ["C3", "C4", "Cz"]
      parietal_occipital: ["P3", "P4", "Pz", "O1", "O2"]
      temporal: ["T3", "T4", "T5", "T6"]
      midline: ["Fpz", "Fz", "Cz", "Pz"]
      left_hemisphere: ["Fp1", "F3", "F7", "C3", "P3", "O1", "T3", "T5"]
      right_hemisphere: ["Fp2", "F4", "F8", "C4", "P4", "O2", "T4", "T6"]
  review_qc:
    baseline_comparisons:
      enabled: true
      smoothing_window_epochs: 5
      max_series_per_family: 6
    null_sanity_tests:
      enabled: true
      seed: 42
    mnps_mnj_sanity:
      enabled: true
      coord_spaces: ["mnps_3d", "coords_9d"]
      finite_row_warn_frac: 0.95
      constant_var_tol: 1.0e-8
      min_unique_values: 3
      cond_warn: 1000000.0
      rel_mse_warn: 1.0
      robustified_variant:
        enabled: true
        winsorize_quantiles: [0.01, 0.99]
        jacobian_ridge_floor: 1.0e-6
  coverage:
    datasets:
      physionet_icare_2_1:
        min_seconds: 30
        min_epochs: 20

time_reference:
  enabled: true
  schema_version: "time_reference.v1"
  parser: "wfdb_header"
  anchor: "first_recording"
  bins_hours: [0, 24, 48, 72]
  datasets:
    physionet_icare_2_1:
      enabled: true
      parser: "wfdb_header"
      anchor: "first_recording"
      bins_hours: [0, 24, 48, 72]

metadata_extraction:
  datasets:
    physionet_icare_2_1:
      filename_parse:
        regex: "^(?P<subject>\\d{4})_(?P<run>\\d{3})_(?P<acq>\\d{3})_EEG\\.hea$"
        subject_pad: 4
      participants:
        # Generic sidecar metadata ingest (key:value text files).
        # Works for files like training/0332/0332.txt and can be reused by
        # changing globs/keys in YAML for other datasets.
        sidecar_files:
          enabled: true
          parser: "key_value"
          file_globs:
            - "*/[0-9][0-9][0-9][0-9].txt"
          key_value_separator: ":"
          key_normalization: "snake_case"
          value_cast: "auto"
          subject_id:
            from_key: "Patient"
            regex: "(?P<subject>\\d{3,8})"
            strip_prefixes: ["sub-"]
            pad: 4
            prefix: "sub-"
      group:
        default: "ICARE"
      condition:
        default: "post_cardiac_arrest_coma"
      task:
        default: "continuous_eeg"

# v2.2 normalization pilot settings for i-care (ComBat).
normalization:
  enabled: false
  method: "combat"
  scope: "post_features"
  batch_key: "hospital"
  covariates: ["group", "age", "sex"]
  reference_policy: "within_dataset"
  combat:
    chunk_size: 24
    min_batch_size: 2
    min_feature_observations: 16
    winsorize_quantiles: [0.005, 0.995]
    family_wise:
      enabled: false
      strategy: "prefix"
      delimiter: "_"
      min_family_columns: 2
      regex_map: {}
  validation:
    enabled: false
    max_rows: 150000
    max_features: 256
    min_group_size: 20
    max_levels: 24
    batch_key: "auto"
    target_keys: []
    metrics:
      batch_eta2: true
      target_eta2: true
      perturbation: true
  datasets:
    physionet_icare_2_1:
      enabled: false
      batch_key: "hospital"
      covariates: ["group", "age", "sex"]

regional_mnps:
  enabled: false
  stratified:
    enabled: false
  block_jacobians:
    enabled: false

mnps_9d:
  enabled: true
  block_jacobians:
    enabled: false
    preset: mde_families_v1
    csv_output: "stratified_block_jacobians_subjects.csv"
