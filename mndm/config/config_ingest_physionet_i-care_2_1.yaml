version: 2.0
modality: eeg

# PhysioNet I-CARE (WFDB) overlay for MNDM smoke and longitudinal analysis.
# Usage:
#   python -m mndm.cli features --dataset physionet_icare_2_1 --config mndm/config/config_ingest_physionet_i-care_2_1.yaml --n-jobs 1
#   python -m mndm.cli summarize --dataset physionet_icare_2_1 --config mndm/config/config_ingest_physionet_i-care_2_1.yaml --n-jobs 1
imports:
  - "./config_ingest_common_eeg.yaml"

datasets:
  - physionet_icare_2_1

source:
  name: "PhysioNet"
  platform: "PhysioNet"
  format: "WFDB"
  dataset_id: "i-care"
  dataset_name: "I-CARE: International Cardiac Arrest REsearch consortium Database"
  dataset_version: "2.1"
  doi: "10.13026/m33r-bj81"
  url: "https://physionet.org/content/i-care/2.1/"

paths:
  processed_dir: "E:/Science_Datasets/physionet/processed"
  dataset_received_dirs:
    physionet_icare_2_1: "E:/Science_Datasets/physionet/received/i-care_2_1_random100_longitudinal/training"

preprocess:
  # Keep native cadence (avoid unnecessary upsampling from WFDB records).
  sfreq: 100
  sfreq_candidates: [100, 128, 200, 250]
  notch_hz: null
  eeg_bandpass: [0.5, 40]
  reref: "average"
  wfdb:
    scale_to_microvolts: false
  artifacts:
    method: "none"

robustness:
  coverage:
    datasets:
      physionet_icare_2_1:
        min_seconds: 120
        min_epochs: 10

time_reference:
  enabled: true
  schema_version: "time_reference.v1"
  parser: "wfdb_header"
  anchor: "first_recording"
  bins_hours: [0, 24, 48, 72]
  datasets:
    physionet_icare_2_1:
      enabled: true
      parser: "wfdb_header"
      anchor: "first_recording"
      bins_hours: [0, 24, 48, 72]

metadata_extraction:
  datasets:
    physionet_icare_2_1:
      filename_parse:
        regex: "^(?P<subject>\\d{4})_(?P<run>\\d{3})_(?P<acq>\\d{3})_EEG\\.hea$"
        subject_pad: 4
      participants:
        # Generic sidecar metadata ingest (key:value text files).
        # Works for files like training/0332/0332.txt and can be reused by
        # changing globs/keys in YAML for other datasets.
        sidecar_files:
          enabled: true
          parser: "key_value"
          file_globs:
            - "*/[0-9][0-9][0-9][0-9].txt"
          key_value_separator: ":"
          key_normalization: "snake_case"
          value_cast: "auto"
          subject_id:
            from_key: "Patient"
            regex: "(?P<subject>\\d{3,8})"
            strip_prefixes: ["sub-"]
            pad: 4
            prefix: "sub-"
      group:
        default: "ICARE"
      condition:
        default: "post_cardiac_arrest_coma"
      task:
        default: "continuous_eeg"
