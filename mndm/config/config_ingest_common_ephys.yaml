version: 2.0
modality: ephys

imports:
  - "./config_ingest_common_nwb.yaml"

datasets: []

source:
  name: "DANDI"
  platform: "DANDI"
  format: "NWB"
  dataset_id: null
  dataset_name: null

paths:
  received_dir: "data/dandi/raw"
  processed_dir: "data/dandi/processed_ephys"
  dataset_received_dirs: {}

preprocess:
  nwb:
    enabled: true
    # Units take precedence when enabled. Set this false to use the inherited
    # continuous ElectricalSeries/LFP-as-EEG path.
    units:
      enabled: true
      quality_policy: "all"
      min_firing_rate_hz: null
      min_presence_ratio: null
      max_isi_violations_ratio: null
      rate_bin_sec: 0.05
      smoothing_sigma_sec: 0.05
      time_start_sec: null
      time_stop_sec: null

epoching:
  length_s: 2.0
  step_s: 1.0

features:
  ephys:
    window_sec: 2.0
    step_sec: 1.0

mnps_projection:
  normalize: "robust_z"
  clip_threshold: 6.0
  v1_mapping:
    m:
      ephys_pairwise_corr_mean: 0.5
      ephys_participation_ratio: 0.5
    d:
      ephys_rate_std_hz: 0.5
      ephys_population_cv: 0.5
    e:
      ephys_mean_rate_hz: 0.5
      ephys_rate_entropy: 0.5
  feature_standardization:
    default: ["robust_z", "clip"]

mnps_9d:
  enabled: true
  definition_version: "2.0"
  versions:
    "2.0":
      subcoords:
        m_a: {ephys_pairwise_corr_mean: 1.0}
        m_e: {ephys_participation_ratio: 1.0}
        m_o: {ephys_top_pc_variance_fraction: 1.0}
        d_n: {ephys_rate_std_hz: 1.0}
        d_l: {ephys_population_cv: 1.0}
        d_s: {ephys_ar1: 1.0}
        e_e: {ephys_rate_entropy: 1.0}
        e_s: {ephys_mean_rate_hz: 1.0}
        e_m: {ephys_active_unit_fraction: 1.0}

mnps:
  fs_out: 1.0
  window_sec: 2.0
  overlap: 0.5
