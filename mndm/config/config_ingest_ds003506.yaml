version: 2.0
modality: eeg

# ds003506 overlay for the Parkinson/control reinforcement-learning cohort.
# Medication status is session-specific in participants.tsv. A trigger-enriched
# staged root rewrites only the events sidecars with compact choose/match event
# families while leaving the EEG payload untouched.
imports:
  - "./config_ingest_common_eeg.yaml"

datasets:
  - ds003506

source:
  name: "OpenNeuro"
  platform: "OpenNeuro"
  format: "BIDS (trigger-enriched staging)"
  dataset_id: "ds003506"
  dataset_name: "EEG: Reinforcement Learning in Parkinson's"
  dataset_version: "1.1.0"
  doi: "10.18112/openneuro.ds003506.v1.1.0"
  url: "https://openneuro.org/datasets/ds003506"
  acknowledgement: "University of New Mexico Cognitive Rhythms and Computation Lab cohort; Parkinson/control repeated-session design with accelerometer X/Y/Z channels."

paths:
  received_dir: "M:/datasets/received/openneuro"
  processed_dir: "M:/datasets/processed/openneuro"
  dataset_received_dirs:
    ds003506: "M:/datasets/received/openneuro/ds003506_trigger_enriched"

preprocess:
  channel_typing:
    datasets:
      ds003506:
        rules:
          - {regex: "^(X|Y|Z)$", type: "misc"}
  artifacts:
    datasets:
      ds003506:
        method: "eog_reg"

epoching:
  datasets:
    ds003506:
      sampling:
        onset_column: "onset"
        duration_column: "duration"
        # Use the staged compact choose/match trigger-family surface rather than
        # the raw free-text BIDS trial_type labels. These remain point-like
        # event labels for provenance/event_mapping, not a canonical stage.
        stage_columns: ["event_subtype_role"]
        prefer_events_stage_in_summary: false

event_mapping:
  datasets:
    ds003506:
      enabled: true

mnps:
  # Compact event-family codebook for BIDS event provenance / event-mapping QC.
  # Keep values in signed-int8 range because the stage arrays are serialized as int8.
  stage_codebook:
    choose_instruction: 40
    choose_stimulus: 41
    choose_response_left: 42
    choose_response_right: 43
    choose_feedback_reward: 44
    choose_feedback_punishment: 45
    choose_feedback_timeout: 46
    choose_feedback_error: 47
    match_instruction: 50
    match_stimulus: 51
    match_response_left: 52
    match_response_right: 53
    match_feedback_reward: 54
    match_feedback_punishment: 55
    match_feedback_timeout: 56
    match_feedback_error: 57

conventional_eeg:
  datasets:
    ds003506:
      enabled: true
      # Parkinson-facing qEEG sidecars: prioritize spectral slowing,
      # alpha peak / edge measures, and common complexity markers.
      packs: ["tier1", "complexity"]
      export:
        per_epoch_columns: true
        summaries: true
      tier1:
        relative_bandpower: true
        ratios: ["theta_alpha", "delta_alpha", "beta_alpha", "slowing_index"]
        peak_frequency:
          alpha_peak_frequency: true
          median_frequency: true
          spectral_edge_95: true
      complexity:
        spectral_entropy: true
        permutation_entropy: true
        hjorth_complexity: true
        hjorth_mobility: true

mnps_projection:
  export_contracts:
    subject_anchored: true
    cohort_anchored: true

robustness:
  ensembles:
    enabled: true
    min_channels: 3
    groups:
      frontal: ["Fp1", "Fp2", "F3", "F4", "Fz", "F7", "F8"]
      central: ["FC1", "FC2", "C3", "Cz", "C4"]
      parietal_occipital: ["P3", "P4", "Pz", "O1", "O2", "PO3", "PO4", "Oz"]
      temporal: ["T7", "T8", "TP7", "TP8"]

regional_mnps:
  enabled: true
  stratified:
    enabled: true
  block_jacobians:
    enabled: true

mnps_9d:
  block_jacobians:
    enabled: true
    preset: mde_families_v1
    csv_output: "stratified_block_jacobians_subjects.csv"

metadata_extraction:
  datasets:
    ds003506:
      group:
        candidates: ["Group"]
        normalize:
          pd: "Parkinson"
          ctl: "Control"
      condition:
        default: "not_applicable"
        session_candidates:
          ses-01: ["sess1_Med"]
          ses-02: ["sess2_Med"]
        normalize:
          on: "ON"
          off: "OFF"
          "n/a": "not_applicable"
          "no s2": "not_applicable"
          nan: "not_applicable"
          none: "not_applicable"
          null: "not_applicable"
      task:
        from_filename: true
        default: "reinforcement_learning"
        normalize:
          reinforcementlearning: "reinforcement_learning"
