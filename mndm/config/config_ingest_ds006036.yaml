version: 1.2
modality: eeg

# ds006036 dataset overlay config.
# Template based on ds004504 (AD/FTD/Healthy EEG cohort), adjusted for ds006036.
imports:
  - "./config_ingest_common_eeg.yaml"

datasets:
  - ds006036

mnps_9d:
  block_jacobians:
    enabled: true
    preset: mde_families_v1
    csv_output: "stratified_block_jacobians_subjects.csv"

preprocess:
  eeg_csd:
    enabled: true
    lambda2: 1.0e-5
    stiffness: 4.0
    n_legendre_terms: 50
    min_eeg_channels: 16
    on_error: "warn"

epoching:
  datasets:
    ds006036:
      sampling:
        # ds006036 photomark events live in *_events.tsv column `value`.
        # This enables per-epoch stage extraction from those events.
        onset_column: "onset"
        duration_column: "duration"
        stage_columns: ["value"]
        # Allow summarize-only reruns to use the inferred stage surface
        # from raw BIDS events instead of stale stage columns in features.csv.
        prefer_events_stage_in_summary: true
        stage_map:
          "PHOTO 3Hz": 57
          "PHOTO 5Hz": 50
          "PHOTO 7Hz": 58
          "PHOTO 10Hz": 51
          "PHOTO 15Hz": 52
          "PHOTO 20Hz": 53
          "Photo/HV mark": 54
          "PHOTO 25Hz": 55
          "PHOTO 30Hz": 56
          "open eyes": 60
          "closed eyes": 61
          "eye movement": 62
          "Swallowing": 63
          "speech": 64
          "head movement": 65
          "muscle": 66
          "CAL mode": 67
          "RESET condition": 68
          "PAT 2 CAL": 69
          "PAT 2 EEG": 70
          "PAT Mon-Cz EEG": 71
          "PAT ComAv EEG": 72
        stage_blocking:
          enabled: true
          # Generic stage-block inference from sparse event markers.
          # Here configured for photic stimulation labels.
          stage_event_regex: "(?i)^PHOTO\\s*(\\d+)\\s*Hz$"
          bridge_marker_labels: ["Photo/HV mark"]
          use_bridge_markers: true
          bridge_tail_sec: 0.5
          bridge_tail_cap_sec: 1.0
          min_block_sec: 2.0
          max_block_sec: 20.0
          preserve_block_assignments: true
          window_membership:
            # Keep windows with strong but not perfect in-block overlap.
            mode: "overlap_frac_ge"
            min_overlap_fraction: 0.75
          # Explicit contract for downstream verification/QC.
          expected_stage_frequencies_hz: [3, 5, 7, 10, 15, 20, 25, 30]

event_locked:
  datasets:
    ds006036:
      enabled: true
      profile: "ds006036_stage_block_end_v1"
      event_source:
        kind: "derived_stage_block_end"
      event_types: ["stage_block_end"]
      # Do not force a sleep-stage filter here: this profile is intended for
      # post-block analyses around photic block ends.
      stage_filter: []
      reference: "onset"
      # Derived block-end events land exactly at block boundaries, so the
      # usual stage-transition exclusion should be disabled for this profile.
      exclude_stage_transition_margin_sec: 0.0
      bins:
        # Bin names are semantic. The exact timing contract is defined by the
        # numeric bounds here, not by the label text itself.
        # Keep bins non-overlapping in one profile because event_locked
        # alignment uses first-match-wins semantics.
        in_block_tail_ms: [-8.0, 0.0]
        post_block_early_ms: [0.0, 8.0]
        post_block_late_ms: [8.0, 16.0]
        # Exploratory short tail such as [-4, 0] should be run as a separate
        # profile/export, not alongside the full [-8, 0] tail in the same run.
      min_overlap_fraction: 0.0
      controls:
        n_controls_per_event: 3
        exclusion_margin_sec: 30.0
        seed: 42
      export:
        write_parquet: true
        write_csv: true

block_native:
  datasets:
    ds006036:
      enabled: true
      source:
        # Reuse existing stage_blocking infrastructure — blocks are already
        # inferred from PHOTO events in epoching.datasets.ds006036.sampling.
        kind: "stage_blocking"
        label_column: "value"
        onset_column: "onset"
        duration_column: "duration"
      window_profile:
        # Named profile alias (maps to kind=sliding over full block).
        profile: "whole_block"
        kind: "sliding"
        window_length_sec: 4.0
        step_sec: 2.0
        emit_relative_position: true
        # Drop blocks that are too short to fit at least two non-overlapping windows.
        min_block_sec: 4.0
        min_windows_per_block: 2
      export:
        write_parquet: true
        write_csv: true

mnps_projection:
  export_contracts:
    subject_anchored: true
    cohort_anchored: true
  # Required for actual cohort_anchored emission when no external anchor file
  # is provided in mnps_projection.anchor.path.
  anchor_auto_fit:
    enabled: true
    anchor_id: "ds006036_cohort_auto_v2_1"
    anchor_source: "ds006036_all_subjects_features_table"
    scale_method: "iqr"
    min_subjects: 3

mnps:
  stage_codebook:
    "PHOTO 3Hz": 57
    "PHOTO 5Hz": 50
    "PHOTO 7Hz": 58
    "PHOTO 10Hz": 51
    "PHOTO 15Hz": 52
    "PHOTO 20Hz": 53
    "Photo/HV mark": 54
    "PHOTO 25Hz": 55
    "PHOTO 30Hz": 56
    "open eyes": 60
    "closed eyes": 61
    "eye movement": 62
    "Swallowing": 63
    "speech": 64
    "head movement": 65
    "muscle": 66
    "CAL mode": 67
    "RESET condition": 68
    "PAT 2 CAL": 69
    "PAT 2 EEG": 70
    "PAT Mon-Cz EEG": 71
    "PAT ComAv EEG": 72

robustness:
  ensembles:
    enabled: true
    min_channels: 3
    groups:
      frontal: ["Fp1", "Fp2", "F3", "F4", "Fz", "F7", "F8"]
      central: ["FC1", "FC2", "C3", "Cz", "C4"]
      parietal_occipital: ["P3", "P4", "Pz", "O1", "O2", "PO3", "PO4", "Oz"]
      temporal: ["T7", "T8", "TP7", "TP8", "T3", "T4", "T5", "T6"]
  coverage:
    datasets:
      ds006036:
        min_seconds: 30
        min_epochs: 10

regional_mnps:
  enabled: true
  stratified:
    enabled: true
  block_jacobians:
    enabled: true

metadata_extraction:
  datasets:
    ds006036:
      group:
        candidates: ["Group"]
        normalize:
          A: "AD"
          F: "FTD"
          C: "Healthy"
      condition:
        default: "eyes_open_photic"
      task:
        from_filename: true
