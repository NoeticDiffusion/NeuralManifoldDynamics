# Standard non-MNPS measurement families plus local-dynamics defaults.
# Import only from explicit qualification/dataset overlays; this file is
# intentionally not imported by the common EEG, fMRI, or ephys configs.
#
# Family schema IDs:
#   diffusion   -> mndm.diffusion_geometry.v1
#   destination -> mndm.committor.v1
#   resilience  -> mndm.finite_amplitude_resilience.v1
#   drift       -> mndm.chart_drift.v1  (SL-LEV-MES-003 identities; default on in this overlay)
#   one_step    -> mndm.affine_one_step.v1 (fit-fidelity-gated lag-1 map + generator proxies; default on)
#   amplification -> mndm.amplification.v1 (same-pair neighbor gain q90; default on)
#   history       -> mndm.history.v1 (frozen M0/M1 OOS + nested M1 operator; default on)
#   turning       -> mndm.turning.v1 (realized successive-increment turning; default on)
# This overlay defaults dynamical_families.enabled and the writable family
# flags (diffusion, destination, resilience, drift, one_step, amplification,
# history, turning) plus local_dynamics FTR / Gate E residuals / Gate F W_Q
# to true. Common EEG/fMRI/ephys profiles still do not import this file.
# Destination and resilience still fail closed without protocol + TQ.
# C1 nested diffusion.drift.enabled stays false (no independent b).
# one_step_rel_mse_threshold stays 0.9; declared_lags stays [1] here.
# Compatibility table (003 §8) maps field names to identities; it does not
# enable families or write /local_dynamics/.
# Local-dynamics schema IDs (v2.6 / v3.0):
#   jacobian_metrics              -> mndm.jacobian_metrics.v1
#   finite_time_response          -> mndm.finite_time_response.v1
#   transition_residuals          -> mndm.transition_residuals.v1
#   residual_covariance (Gate E)  -> derived from transition residuals
#   stochastic_reachability       -> mndm.stochastic_reachability.v1
#
# There is no family YAML flag named `spread`. Opt-in discrete W_Q is
# local_dynamics.stochastic_reachability and writes /stochastic_reachability/v1.
# 002 future-spread names under dynamical_families are refused. State-matched
# future spread is level1, not level0. Multi-step W_Q is not level2.
# W_Q is not conditional_future_spread_level1; w_q_as_conditional_future_spread_level1
# is refused. Nested dynamical_families.local_dynamics / possible_futures /
# perturbation are logical 003 paths, not writable HDF5 roots. Top-level
# local_dynamics.stochastic_reachability remains the opt-in W_Q switch.
# Attractor, basin, persistence, and recurrence YAML keys are refused,
# including the 002 measurement names and headings. Recurrence is not an
# attractor. -log(P_RR)/dt is not an escape rate. Hysteresis, recovery,
# and 002/003 return-path names are refused. Matching is not automatically
# level2. Hysteresis is not FAR. recovery_time_level1 is not
# excursion_recovery_time_median_level1.
#
# Translation-qualification (TQ) gating is NOT uniform across families:
#   diffusion:              TQ id/hash are a provenance method tag ONLY.
#                            `qualified` is never read; computation proceeds
#                            whenever diffusion.enabled=true and the estimator
#                            has support, regardless of TQ state.
#   drift / one_step:       no TQ gate. computed/insufficient_support when
#                            enabled and the estimator has support. Never
#                            translation_qualified. one_step identification
#                            is mndm.one_step_fit_fidelity.v1, not OD-TQ.
#   destination/resilience: TQ IS a hard gate. `qualified: true` PLUS a
#                            non-empty qualification_id AND
#                            qualification_contract_hash are all required, or
#                            the family is written as computation_status
#                            "not_testable" with an explicit failure_reason
#                            instead of being computed.
# (see mndm/src/mndm/pipeline/dynamical_families_export.py)
dynamical_families:
  enabled: true
  coordinate_layer: subject_anchored
  diffusion:
    enabled: true
    # Register identity of series/a_hat is conditional_covariance_rate_level1
    # (centered increment covariance / nominal dt, convention a not D/2).
    # Nested increment_covariance_level0 is unconditional Cov(ΔX), not /dt,
    # not local kNN, and not a_hat. YAML nested name is refused.
    # That is not a rename of a_hat and not ito_diffusion_tensor_level3.
    # d_diff / c_diff are derived scalars of a_hat, not
    # diffusion_effective_dimension_level1 or diffusion_condition_number_level1.
    # Lag-1 source_idx / transition_support_id are support metadata, not a
    # new family. YAML remains the only enable switch; this overlay defaults on.
    # Informational only: no other estimator is wired, and `qualified` above
    # is never read as a gate (only qualification_id/hash are copied into
    # provenance once computed). Changing this string does not change which
    # function runs.
    estimator: local_increment_covariance
    # Method tags only. When enabled, ingest computes if the estimator has
    # support. qualification_id / hash do not gate computation. `qualified`
    # itself is not read by ingest at all (see header note above).
    translation_qualification:
      qualified: false
      qualification_id: null
      qualification_contract_hash: null
    # C1 alignment_only is library-qualified (DF-DRIFT-C1 M1–M2). Ingest does
    # not supply a vector. C2 residualize_increments is not authorized.
    # Only `enabled`, `mode`, and `source` are read by
    # dynamical_families/chart_drift.py; qualification_id/
    # qualification_contract_hash below are reserved for a future authorized
    # drift source and are not consumed by any current code path.
    drift:
      enabled: false
      mode: alignment_only
      source: not_supplied
      qualification_id: null
      qualification_contract_hash: null
    neighborhood: {k: 20}
    min_samples: 30
    min_neighborhood_samples: 10
    max_gap_sec: null
    max_dt_relative_deviation: 0.05
    # Minimum finite-row fraction required before the estimator will attempt
    # a fit; explicit here because destination's identically named estimator
    # kwarg is NOT wired to any YAML key (always uses its own 0.1 default).
    min_valid_fraction: 0.1
    psd_floor: 1.0e-8
  # SL-LEV-MES-003 chart-drift identities. Default on in this overlay. This is
  # not Family B,
  # not /mnps_3d_dot, and not an independent b for A_bD / R_b/a. Never write
  # ito_qualified or ito_drift_level3. Old nested keys
  # finite_lag/crossfit/ito_candidate are refused. Nested
  # crossfit_local_chart_b is refused; using it as drift.source stays
  # resolver-closed (crossfit_not_authorized_before_m3) and is not an
  # independent b for A_bD.
  drift:
    enabled: true
    # SL-LEV-MES-003 identities. Pooled lag-1 source_idx shares
    # transition_support_id with diffusion when both compute. Cross-fit is a
    # variant subset with its own support_id; embargo_semantics=index_steps.
    estimator: local_conditional_increment_mean
    neighborhood: {k: 20}
    min_samples: 30
    # Frozen 3D floor: max(10, 3d+1) = 10. Not Jacobian's 90-parameter burden.
    min_neighborhood_samples: 10
    max_gap_sec: null
    max_dt_relative_deviation: 0.05
    max_neighborhood_radius: null
    min_temporal_span_sec: null
    min_valid_fraction: 0.1
    weight_mode: inverse_distance
    realized_velocity_level0:
      enabled: true
    conditional_mean_rate_level1:
      pooled:
        enabled: true
      blocked_crossfit:
        enabled: true
        n_blocks: 2
        embargo_steps: 4
      lag_diagnostics:
        enabled: true
        lags: [1, 2, 4]
        consistency_rel_tol: 0.5
  # Generic fit-fidelity-gated lag-1 affine map (SL-LEV-MES-003 level 2) plus
  # generator proxies (level 3) from logm(Phi)/dt. Default on in this overlay.
  # I-CARE dynamical-families overlays may set declared_lags: [1, 2];
  # that is an overlay opt-in, not an I-CARE-tuned estimator and not TQ.
  # Not the production Jacobian, not expm(J_hat dt), not jacobian_metrics
  # abscissa, and not ito_drift_level3. v1 fits one recording-level map
  # with two chronological folds and an index embargo
  # (embargo_semantics=index_steps). Identified iff the median of the two
  # blocked-holdout rel-MSE scores is strictly < 0.9 vs the mean-next-state
  # baseline (mndm.one_step_fit_fidelity.v1), distinct from the I-CARE
  # jacobian_metrics fit_fidelity_gate. neighborhood.k is logged and unused
  # for Phi. Grain is native=recording, repeated_measure=false:
  # window-shaped series are broadcasts of one operator, not T replicates.
  # Nested identities: affine_one_step_map_level2,
  # conditional_affine_mean_rate_level2, innovation_covariance_level2
  # (affine residual, not diffusion a_hat; C2 stays closed). Level 2
  # qualification_status is one_step_identified or one_step_not_identified.
  # Level 3 (spectral/numerical_abscissa, divergence,
  # generator_rotation_norm) only if the map is identified and logm is
  # real; qualification_status is
  # generator_proxy_from_qualified_one_step_not_ito. reactivity_gap_level3
  # (omega-alpha) is withheld; jacobian_metrics reactivity_gap is not that
  # identity. operator_gain_anisotropy_level2 and
  # generator_symmetric_anisotropy_level3 are withheld. Forbidden YAML keys:
  # ito_drift_level3, ito_qualified, jacobian_expm,
  # jacobian_expm_as_fitted_phi, multi_step_rollout,
  # one_step_iteration_as_level2, phi_one_composed_as_lag2, affine_two_step,
  # two_step, abscissa_from_unidentified_operator,
  # innovation_as_diffusion_a_hat, mnps_xdot_as_one_step_map,
  # reactivity_gap_level3, abscissa_difference_as_reactivity_gap,
  # jacobian_reactivity_gap_as_level3, operator_gain_anisotropy_level2,
  # generator_symmetric_anisotropy_level3. Not a
  # drift_source for A_bD. 3D subject-anchored only. declared_lags: [1]
  # is the implemented default. Direct lag-2 writes under declared_lag_2/
  # when declared_lags includes 2. Composing Phi_1 is not that identity;
  # Phi_1 applied twice is iterated_one_step_horizon_map_level4 when the
  # lag-1 map is identified and horizon holdout at 2 dt beats 0.9.
  # embargo_steps must be >= declared_lag_steps; default 4 covers lag 1
  # and lag 2. Lag-2 generator proxies write under declared_lag_2/ from
  # logm(Phi_2)/nominal_dt when that map is identified. Still not Ito.
  # Euclidean functionals of a qualified Phi (max-gain, volume-gain,
  # polar rotation) write at the requested lag. They are not spectral
  # abscissa, not finite_time_peak_gain_level4 / Phi powers, and not
  # epsilon-rescued. iterated_one_step_horizon_map_level4 is a separate
  # object. Common declared_lags stays [1]. I-CARE dynamical-families overlays
  # may set declared_lags: [1, 2] as a coverage opt-in; they do not
  # retune one_step_rel_mse_threshold.
  one_step:
    enabled: true
    estimator: recording_affine_discrete_map
    neighborhood: {k: 20}
    min_samples: 30
    min_neighborhood_samples: 10
    max_gap_sec: null
    max_dt_relative_deviation: 0.05
    ridge_alpha: 1.0e-4
    one_step_rel_mse_threshold: 0.9
    n_blocks: 2
    embargo_steps: 4
    declared_lags: [1]
  amplification:
    # 001 amplification L1: q90 of same-pair Euclidean neighbor gains
    # at lag 1, plus nested same-pair separation, gain-rate, and
    # cloud-volume identities. Not operator max-gain, not spectral
    # abscissa, not operator volume. YAML nested names are refused.
    # History predictive gain is a separate family. Default on in this overlay.
    enabled: true
    estimator: same_pair_neighbor_gain_q90
    neighborhood: {k: 20}
    min_samples: 30
    min_neighborhood_samples: 10
    max_gap_sec: null
    max_dt_relative_deviation: 0.05
    q: 0.90
    distance_epsilon: 1.0e-12
  history:
    # 001 history L1: OOS MSE(M0)-MSE(M1) on the same lag-1 triples.
    # Frozen affine M0: x_t -> x_{t+1}. Frozen affine M1:
    # (x_t, x_{t-1}) -> x_{t+1}. Nested L2 writes when M1 passes
    # the frozen 0.9 one-step OOS gate. YAML key
    # history_conditioned_operator_level2 is refused (not a toggle).
    # history_augmented_generator_level3 / propagator_level4 remain
    # withheld: not logm of 3x6 M1, not M1 iteration, not Ito.
    # Not Markov restoration. Not lag-1 Phi. Default on in this overlay.
    enabled: true
    estimator: frozen_affine_m0_m1_oos
    min_samples: 30
    min_triples: 20
    max_gap_sec: null
    max_dt_relative_deviation: 0.05
    ridge_alpha: 1.0e-4
    n_blocks: 2          # frozen; any other value is not_testable
    embargo_steps: 4     # frozen; any other value is not_testable
  turning:
    # 001 rotation L0: angle between consecutive lag-1 displacements,
    # and that angle over observed dt. Insufficient displacement is
    # undefined, not zero. Not operator rotation. Cloud volume writes
    # under amplification, not turning. Default on in this overlay.
    enabled: true
    estimator: successive_increment_turning
    min_samples: 30
    min_pairs: 20
    max_gap_sec: null
    max_dt_relative_deviation: 0.05
    min_displacement: 1.0e-12
  destination:
    enabled: true
    # 002 destination identities under 003: ingest O2b q_A_to_B is
    # restricted_1d_local_law_quadrature_q, not generator_committor_level3.
    # First-hit q_A_to_B is destination_first_hit_fraction_resolved_level1
    # (x-conditioned, not level0). Series name is not renamed.
    # destination_hit_probability_level1 (including unresolved) and
    # destination_unresolved_fraction_level1 remain withheld. YAML nested
    # names and substitutions (resolved_q_as_..., include_unresolved_in_first_hit_q)
    # are refused. YAML keys committor / generator_committor_level3 /
    # transition_model_first_hit_probability_level2 /
    # transition_model_first_hit_probability_level4 are refused.
    # Only an explicit first-hit label column and scalar reaction-coordinate
    # column may activate the O2b adapter; no stage/coordinate inference.
    # To actually activate destination, an overlay must set the EXACT
    # sentinel values below (any other string leaves this "not_testable"):
    #   regime_source: explicit_first_hit_labels
    #   label_key: stage
    #   reaction_coordinate.source: explicit_column   (already set)
    #   reaction_coordinate.key: <a real feature/column name>
    # plus translation_qualification.qualified: true with non-null,
    # non-empty qualification_id and qualification_contract_hash, plus a
    # positive, finite diffusion_coefficient (see below).
    regime_source: null
    label_key: null
    reaction_coordinate:
      source: explicit_column
      key: null
      name: reaction_coordinate
      boundaries: [-0.8, 0.8]
    estimator: local_law_dense_grid_o2b
    # Unlike diffusion, `qualified` here IS a hard gate: it plus non-empty
    # qualification_id/qualification_contract_hash are all required before
    # ingest will compute destination at all (see header note above).
    translation_qualification:
      qualified: false
      qualification_id: null
      qualification_contract_hash: null
    # Hard minimum enforced by the estimator: values below 65 are refused
    # (o2b_grid_resolution_below_minimum), not silently clamped.
    grid_resolution: 65
    set_A: []
    set_B: []
    # Must be overridden to a positive, finite float before destination can
    # compute; a `null` (as templated here) is now coerced to NaN in ingest
    # and yields an explicit computation_status=invalid /
    # failure_reason=diffusion_coefficient_must_be_positive result rather
    # than crashing, but destination will never actually compute until this
    # is set.
    diffusion_coefficient: null
    min_samples: 30
    min_support_per_grid: 30
    min_transition_segments: 5
    max_dt_relative_deviation: 0.05
  resilience:
    enabled: true
    # 002 FAR identities under 003: ingest amplitude_curve is
    # far_recovery_probability_level4 when a perturbation protocol exists.
    # Spontaneous return / excursion recovery are not FAR. YAML keys
    # spontaneous_return_fraction_level0, excursion_recovery_probability_level1,
    # excursion_recovery_time_median_level1,
    # matched_perturbation_recovery_level2, matched_perturbation_recovery_level1,
    # far_threshold_p50_level4, and far_threshold_p90_level4 are refused.
    # Substitutions amplitude_curve_as_spontaneous_return and
    # r50_as_far_threshold_p50 are also refused.
    # Existing r50 is discrete_first_bin_at_or_below_half,
    # not the 002 supremum threshold.
    # Requires explicit observed perturbation outcomes. No spontaneous
    # trajectory, Jacobian, reachability, or centroid fallback is permitted.
    # protocol_source must literally equal explicit_perturbation_outcomes,
    # and amplitude/returned arrays must actually be supplied by the caller
    # (not just this YAML) before resilience is testable at all.
    protocol_source: null
    estimator: observed_perturbation_outcome_summary
    amplitude_key: null
    returned_key: null
    survived_key: null
    recovery_time_key: null
    # When protocol_source is set, `protocol` must be a complete mapping
    # with non-empty string values for: perturbation_direction,
    # perturbation_time, reference_attractor_or_state, return_criterion,
    # escape_criterion, observation_horizon, plus a boolean
    # non_return_is_escape. An empty {} (as templated here) always fails
    # incomplete_perturbation_protocol by design (fail-closed).
    protocol: {}
    min_trials_per_amplitude: 20
    # Same hard-gate rule as destination (see header note above): `qualified`
    # here IS enforced, unlike diffusion's.
    translation_qualification:
      qualified: false
      qualification_id: null
      qualification_contract_hash: null

# v2.6 / v3.0 local-dynamics defaults. Jacobian metrics are computed whenever
# J_hat exists. In this overlay FTR, Gate E transition residuals, and Gate F
# W_Q default on. Residual-covariance proxy is derived from Gate E and is not a
# separate YAML family. Common EEG/fMRI/ephys profiles must not import this
# file. Destination/resilience still require protocol + TQ to compute.
local_dynamics:
  jacobian_metrics:
    stability_zero_tolerance: 1.0e-8
    reactivity_zero_tolerance: 1.0e-8
    # fit_fidelity_gate is opt-in and defaults to disabled here (no key set).
    # Overlays that need it (e.g. config_ingest_physionet_i-care_2_1_*) set
    # local_dynamics.jacobian_metrics.fit_fidelity_gate.enabled/threshold
    # explicitly. See project/mnps_v3/tests/ingest_jacobian_fidelity_handover.md.
  finite_time_response:
    enabled: true
    propagator_mode: time_ordered_expm
    horizon_steps: [1, 2, 4]
    max_gap_sec: null
    validation_level: model_derived
  transition_residuals:
    enabled: true
    # Cross-fitted one-step residual construction itself only reads
    # `enabled` and `crossfit_embargo_steps`. `max_dt_deviation_sec` and
    # `min_eigenvalue` below are NOT read by the residual step — they
    # parameterize the derived Gate E residual-covariance-proxy (Q) that in
    # turn feeds Gate F stochastic_reachability below. They live here
    # because that is where ingest reads them (pipeline/summary.py), not
    # because they gate transition-residual computation itself.
    crossfit_embargo_steps: 4
    max_dt_deviation_sec: 1.0e-6
    min_eigenvalue: 1.0e-8
  stochastic_reachability:
    # Gate F. Requires transition_residuals.enabled above: otherwise ingest
    # writes computation_status=unavailable /
    # failure_reason=transition_residuals_not_requested instead of W_Q.
    enabled: true
