version: 2.0
modality: eeg

# I-CARE part1 CPC1/5 12-24h export without regional MNPS.
# Input folder is produced by physionet_ingest config with:
#   subset.min_eeg_hours_per_patient: 12
#   subset.max_eeg_hours_per_patient: 24
imports:
  - "./config_ingest_physionet_i-care_2_1_12_24.yaml"

paths:
  # Keep standard PhysioNet processed root; pass --out-dir to isolate reruns.
  processed_dir: "E:/Science_Datasets/physionet/processed"
  dataset_received_dirs:
    physionet_icare_2_1: "E:/Science_Datasets/physionet/received/i-care_2_1_part1_cpc15_longitudinal_12_24h/training"

# Regional outputs are intentionally disabled for this run.
regional_mnps:
  enabled: false
  stratified:
    enabled: false
  block_jacobians:
    enabled: false

mnps_9d:
  enabled: true
  block_jacobians:
    enabled: false

conventional_eeg:
  enabled: true
  packs: ["tier1", "complexity", "coma"]
  export:
    per_epoch_columns: true
    summaries: true
  coma:
    suppression_ratio: true
    burst_suppression_proxy: true
    continuity_proxy: true
    alpha_delta_ratio: true
    suppression:
      amplitude_floor: 0.01
      relative_to_rms: 0.20
      envelope_smoothing_sec: 0.25
    reactivity_proxy:
      enabled: true
      diff_features:
        - eeg_conventional_coma_alpha_delta_ratio
        - eeg_conventional_coma_continuity_proxy
        - eeg_permutation_entropy
        - eeg_highfreq_power_30_45
      eps: 1.0e-6
      clip_at: 5.0

normalization:
  enabled: false
  method: "combat"
  scope: "post_features"
  batch_key: "hospital"
  covariates: ["group", "age", "sex"]
  reference_policy: "within_dataset"
  combat:
    chunk_size: 24
    min_batch_size: 2
    min_feature_observations: 16
    winsorize_quantiles: [0.005, 0.995]
    family_wise:
      enabled: false
      strategy: "prefix"
      delimiter: "_"
      min_family_columns: 2
      regex_map: {}
  validation:
    enabled: false
    max_rows: 150000
    max_features: 256
    min_group_size: 20
    max_levels: 24
    batch_key: "auto"
    target_keys: ["group", "cpc"]
    metrics:
      batch_eta2: true
      target_eta2: true
      perturbation: true
  datasets:
    physionet_icare_2_1:
      enabled: false
      batch_key: "hospital"
      covariates: ["group", "age", "sex"]

mnps_projection:
  anchor:
    enabled: false
